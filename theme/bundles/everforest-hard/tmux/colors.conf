# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#272e33"
set -g @color-surface-active "#2d353b"
set -g @color-surface-chrome "#333c43"
set -g @color-surface-highlight "#493b40"
set -g @color-divider "#333c43"
set -g @color-copy-indicator "#543a48"
set -g @color-text "#fffbef"
set -g @color-text-ui "#fffbef"
set -g @color-text-muted "#543a48"
set -g @color-text-default "#fffbef"
set -g @color-accent-primary "#dfa000"
set -g @color-accent-secondary "#f57d26"
set -g @color-accent-tertiary "#f85552"
set -g @color-accent-highlight "#8da101"
set -g @color-accent-info "#3a94c5"
set -g @color-accent-periwinkle "#e66868"
set -g @color-accent-warn "#df69ba"
set -g @color-accent-amber "#35a77c"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#272e33" ; setw pane-active-border-style "fg=#f57d26, bg=#272e33" } { setw window-active-style "bg=#2d353b" ; setw pane-active-border-style "fg=#f57d26, bg=#272e33" }'
set -g status-style "bg=#272e33"
setw -g pane-active-border-style "fg=#f57d26, bg=#272e33"
setw -g pane-border-style "fg=#543a48, bg=#272e33"
setw -g message-style "fg=#543a48, bg=#272e33, fill=#272e33"
set -g message-command-style "fg=#543a48, bg=#272e33, fill=#272e33"
setw -g copy-mode-position-style "fg=#fffbef,bg=#543a48"
set -g prompt-cursor-colour "#fffbef"
setw -g copy-mode-line-number-style "fg=#543a48,dim"
setw -g copy-mode-current-line-number-style "fg=#8da101,bold"
setw -g window-active-style "bg=#272e33"
setw -g window-style "bg=#272e33"
set -g window-status-current-style "fg=#8da101, bg=#272e33"
set -g window-status-style "fg=#fffbef, bg=#272e33"
set -g window-status-last-style "fg=#fffbef, bg=#272e33"
set -g window-status-activity-style "fg=#fffbef, bg=#272e33"
set -g window-status-bell-style "fg=#543a48, bg=#272e33, bold"
