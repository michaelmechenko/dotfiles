# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#1e2326"
set -g @color-surface-active "#232a2e"
set -g @color-surface-chrome "#272e33"
set -g @color-surface-highlight "#2d353b"
set -g @color-divider "#272e33"
set -g @color-copy-indicator "#667885"
set -g @color-text "#fffbef"
set -g @color-text-ui "#fffbef"
set -g @color-text-muted "#758795"
set -g @color-text-default "#fffbef"
set -g @color-accent-primary "#dfa000"
set -g @color-accent-secondary "#f57d26"
set -g @color-accent-tertiary "#f85552"
set -g @color-accent-highlight "#8da101"
set -g @color-accent-info "#3a94c5"
set -g @color-accent-periwinkle "#e66868"
set -g @color-accent-warn "#df69ba"
set -g @color-accent-amber "#35a77c"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#1e2326" ; setw pane-active-border-style "fg=#f57d26, bg=#1e2326" } { setw window-active-style "bg=#232a2e" ; setw pane-active-border-style "fg=#f57d26, bg=#1e2326" }'
set -g status-style "bg=#1e2326"
setw -g pane-active-border-style "fg=#f57d26, bg=#1e2326"
setw -g pane-border-style "fg=#758795, bg=#1e2326"
setw -g message-style "fg=#758795, bg=#1e2326, fill=#1e2326"
set -g message-command-style "fg=#758795, bg=#1e2326, fill=#1e2326"
setw -g copy-mode-position-style "fg=#fffbef,bg=#667885"
set -g prompt-cursor-colour "#fffbef"
setw -g copy-mode-line-number-style "fg=#758795,dim"
setw -g copy-mode-current-line-number-style "fg=#8da101,bold"
setw -g window-active-style "bg=#1e2326"
setw -g window-style "bg=#1e2326"
set -g window-status-current-style "fg=#8da101, bg=#1e2326"
set -g window-status-style "fg=#fffbef, bg=#1e2326"
set -g window-status-last-style "fg=#fffbef, bg=#1e2326"
set -g window-status-activity-style "fg=#fffbef, bg=#1e2326"
set -g window-status-bell-style "fg=#758795, bg=#1e2326, bold"
