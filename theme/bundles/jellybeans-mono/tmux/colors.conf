# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#000000"
set -g @color-surface-active "#101010"
set -g @color-surface-chrome "#151515"
set -g @color-surface-highlight "#1c1c1c"
set -g @color-divider "#151515"
set -g @color-copy-indicator "#636363"
set -g @color-text "#ffffff"
set -g @color-text-ui "#ffffff"
set -g @color-text-muted "#727272"
set -g @color-text-default "#ffffff"
set -g @color-accent-primary "#ffaf00"
set -g @color-accent-secondary "#c95c5c"
set -g @color-accent-tertiary "#afd787"
set -g @color-accent-highlight "#b39066"
set -g @color-accent-info "#40000a"
set -g @color-accent-periwinkle "#a08070"
set -g @color-accent-warn "#7a8aa6"
set -g @color-accent-amber "#556779"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#000000" ; setw pane-active-border-style "fg=#c95c5c, bg=#000000" } { setw window-active-style "bg=#101010" ; setw pane-active-border-style "fg=#c95c5c, bg=#000000" }'
set -g status-style "bg=#000000"
setw -g pane-active-border-style "fg=#c95c5c, bg=#000000"
setw -g pane-border-style "fg=#727272, bg=#000000"
setw -g message-style "fg=#727272, bg=#000000, fill=#000000"
set -g message-command-style "fg=#727272, bg=#000000, fill=#000000"
setw -g copy-mode-position-style "fg=#ffffff,bg=#636363"
set -g prompt-cursor-colour "#ffffff"
setw -g copy-mode-line-number-style "fg=#727272,dim"
setw -g copy-mode-current-line-number-style "fg=#b39066,bold"
setw -g window-active-style "bg=#000000"
setw -g window-style "bg=#000000"
set -g window-status-current-style "fg=#b39066, bg=#000000"
set -g window-status-style "fg=#ffffff, bg=#000000"
set -g window-status-last-style "fg=#ffffff, bg=#000000"
set -g window-status-activity-style "fg=#ffffff, bg=#000000"
set -g window-status-bell-style "fg=#727272, bg=#000000, bold"
