# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#0d0c0b"
set -g @color-surface-active "#101010"
set -g @color-surface-chrome "#38100a"
set -g @color-surface-highlight "#2c2824"
set -g @color-divider "#38100a"
set -g @color-copy-indicator "#70665b"
set -g @color-text "#f9f5ec"
set -g @color-text-ui "#f9f5ec"
set -g @color-text-muted "#817569"
set -g @color-text-default "#f9f5ec"
set -g @color-accent-primary "#d9a45a"
set -g @color-accent-secondary "#cc4d4d"
set -g @color-accent-tertiary "#d8a16c"
set -g @color-accent-highlight "#e8c88c"
set -g @color-accent-info "#6aa84c"
set -g @color-accent-periwinkle "#1e1e7a"
set -g @color-accent-warn "#7e2e23"
set -g @color-accent-amber "#c88a77"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#0d0c0b" ; setw pane-active-border-style "fg=#cc4d4d, bg=#0d0c0b" } { setw window-active-style "bg=#101010" ; setw pane-active-border-style "fg=#cc4d4d, bg=#0d0c0b" }'
set -g status-style "bg=#0d0c0b"
setw -g pane-active-border-style "fg=#cc4d4d, bg=#0d0c0b"
setw -g pane-border-style "fg=#817569, bg=#0d0c0b"
setw -g message-style "fg=#817569, bg=#0d0c0b, fill=#0d0c0b"
set -g message-command-style "fg=#817569, bg=#0d0c0b, fill=#0d0c0b"
setw -g copy-mode-position-style "fg=#f9f5ec,bg=#70665b"
set -g prompt-cursor-colour "#f9f5ec"
setw -g copy-mode-line-number-style "fg=#817569,dim"
setw -g copy-mode-current-line-number-style "fg=#e8c88c,bold"
setw -g window-active-style "bg=#0d0c0b"
setw -g window-style "bg=#0d0c0b"
set -g window-status-current-style "fg=#e8c88c, bg=#0d0c0b"
set -g window-status-style "fg=#f9f5ec, bg=#0d0c0b"
set -g window-status-last-style "fg=#f9f5ec, bg=#0d0c0b"
set -g window-status-activity-style "fg=#f9f5ec, bg=#0d0c0b"
set -g window-status-bell-style "fg=#817569, bg=#0d0c0b, bold"
