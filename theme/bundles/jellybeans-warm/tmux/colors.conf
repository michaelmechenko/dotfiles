# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#000000"
set -g @color-surface-active "#141008"
set -g @color-surface-chrome "#1c1510"
set -g @color-surface-highlight "#281e14"
set -g @color-divider "#1c1510"
set -g @color-copy-indicator "#281e14"
set -g @color-text "#ffffff"
set -g @color-text-ui "#ffffff"
set -g @color-text-muted "#281e14"
set -g @color-text-default "#ffffff"
set -g @color-accent-primary "#ffaf00"
set -g @color-accent-secondary "#0000df"
set -g @color-accent-tertiary "#d74545"
set -g @color-accent-highlight "#e6a75a"
set -g @color-accent-info "#700089"
set -g @color-accent-periwinkle "#fad07a"
set -g @color-accent-warn "#5f9ecf"
set -g @color-accent-amber "#902020"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#000000" ; setw pane-active-border-style "fg=#0000df, bg=#000000" } { setw window-active-style "bg=#141008" ; setw pane-active-border-style "fg=#0000df, bg=#000000" }'
set -g status-style "bg=#000000"
setw -g pane-active-border-style "fg=#0000df, bg=#000000"
setw -g pane-border-style "fg=#281e14, bg=#000000"
setw -g message-style "fg=#281e14, bg=#000000, fill=#000000"
set -g message-command-style "fg=#281e14, bg=#000000, fill=#000000"
setw -g copy-mode-position-style "fg=#ffffff,bg=#281e14"
set -g prompt-cursor-colour "#ffffff"
setw -g copy-mode-line-number-style "fg=#281e14,dim"
setw -g copy-mode-current-line-number-style "fg=#e6a75a,bold"
setw -g window-active-style "bg=#000000"
setw -g window-style "bg=#000000"
set -g window-status-current-style "fg=#e6a75a, bg=#000000"
set -g window-status-style "fg=#ffffff, bg=#000000"
set -g window-status-last-style "fg=#ffffff, bg=#000000"
set -g window-status-activity-style "fg=#ffffff, bg=#000000"
set -g window-status-bell-style "fg=#281e14, bg=#000000, bold"
