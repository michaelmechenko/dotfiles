# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#0d0c0c"
set -g @color-surface-active "#0f0f15"
set -g @color-surface-chrome "#181616"
set -g @color-surface-highlight "#1a1a22"
set -g @color-divider "#181616"
set -g @color-copy-indicator "#61617d"
set -g @color-text "#ecece8"
set -g @color-text-ui "#ecece8"
set -g @color-text-muted "#6e6e8e"
set -g @color-text-default "#ecece8"
set -g @color-accent-primary "#e98a00"
set -g @color-accent-secondary "#de9800"
set -g @color-accent-tertiary "#cc6d00"
set -g @color-accent-highlight "#ff9e3b"
set -g @color-accent-info "#e82424"
set -g @color-accent-periwinkle "#ff5d62"
set -g @color-accent-warn "#ffa066"
set -g @color-accent-amber "#d7474b"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#0d0c0c" ; setw pane-active-border-style "fg=#de9800, bg=#0d0c0c" } { setw window-active-style "bg=#0f0f15" ; setw pane-active-border-style "fg=#de9800, bg=#0d0c0c" }'
set -g status-style "bg=#0d0c0c"
setw -g pane-active-border-style "fg=#de9800, bg=#0d0c0c"
setw -g pane-border-style "fg=#6e6e8e, bg=#0d0c0c"
setw -g message-style "fg=#6e6e8e, bg=#0d0c0c, fill=#0d0c0c"
set -g message-command-style "fg=#6e6e8e, bg=#0d0c0c, fill=#0d0c0c"
setw -g copy-mode-position-style "fg=#ecece8,bg=#61617d"
set -g prompt-cursor-colour "#ecece8"
setw -g copy-mode-line-number-style "fg=#6e6e8e,dim"
setw -g copy-mode-current-line-number-style "fg=#ff9e3b,bold"
setw -g window-active-style "bg=#0d0c0c"
setw -g window-style "bg=#0d0c0c"
set -g window-status-current-style "fg=#ff9e3b, bg=#0d0c0c"
set -g window-status-style "fg=#ecece8, bg=#0d0c0c"
set -g window-status-last-style "fg=#ecece8, bg=#0d0c0c"
set -g window-status-activity-style "fg=#ecece8, bg=#0d0c0c"
set -g window-status-bell-style "fg=#6e6e8e, bg=#0d0c0c, bold"
