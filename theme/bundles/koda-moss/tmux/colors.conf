# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#0e1415"
set -g @color-surface-active "#182325"
set -g @color-surface-chrome "#30464a"
set -g @color-surface-highlight "#324143"
set -g @color-divider "#30464a"
set -g @color-copy-indicator "#67959d"
set -g @color-text "#cecece"
set -g @color-text-ui "#cecece"
set -g @color-text-muted "#7aa2a9"
set -g @color-text-default "#cecece"
set -g @color-accent-primary "#ec8013"
set -g @color-accent-secondary "#d2322d"
set -g @color-accent-tertiary "#c33c33"
set -g @color-accent-highlight "#cd974b"
set -g @color-accent-info "#6abf40"
set -g @color-accent-periwinkle "#47bea9"
set -g @color-accent-warn "#71ade7"
set -g @color-accent-amber "#8ebeec"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#0e1415" ; setw pane-active-border-style "fg=#d2322d, bg=#0e1415" } { setw window-active-style "bg=#182325" ; setw pane-active-border-style "fg=#d2322d, bg=#0e1415" }'
set -g status-style "bg=#0e1415"
setw -g pane-active-border-style "fg=#d2322d, bg=#0e1415"
setw -g pane-border-style "fg=#7aa2a9, bg=#0e1415"
setw -g message-style "fg=#7aa2a9, bg=#0e1415, fill=#0e1415"
set -g message-command-style "fg=#7aa2a9, bg=#0e1415, fill=#0e1415"
setw -g copy-mode-position-style "fg=#cecece,bg=#67959d"
set -g prompt-cursor-colour "#cecece"
setw -g copy-mode-line-number-style "fg=#7aa2a9,dim"
setw -g copy-mode-current-line-number-style "fg=#cd974b,bold"
setw -g window-active-style "bg=#0e1415"
setw -g window-style "bg=#0e1415"
set -g window-status-current-style "fg=#cd974b, bg=#0e1415"
set -g window-status-style "fg=#cecece, bg=#0e1415"
set -g window-status-last-style "fg=#cecece, bg=#0e1415"
set -g window-status-activity-style "fg=#cecece, bg=#0e1415"
set -g window-status-bell-style "fg=#7aa2a9, bg=#0e1415, bold"
