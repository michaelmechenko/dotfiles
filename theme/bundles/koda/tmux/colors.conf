# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#101010"
set -g @color-surface-active "#272727"
set -g @color-surface-chrome "#403a3a"
set -g @color-surface-highlight "#474747"
set -g @color-divider "#701516"
set -g @color-copy-indicator "#858585"
set -g @color-text "#ffffff"
set -g @color-text-ui "#ffffff"
set -g @color-text-muted "#949494"
set -g @color-text-default "#ffffff"
set -g @color-accent-primary "#ff5733"
set -g @color-accent-secondary "#14ba19"
set -g @color-accent-tertiary "#458ee6"
set -g @color-accent-highlight "#ff7676"
set -g @color-accent-info "#d9ba73"
set -g @color-accent-periwinkle "#5abfb5"
set -g @color-accent-warn "#8ebeec"
set -g @color-accent-amber "#8ebeec"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#101010" ; setw pane-active-border-style "fg=#14ba19, bg=#101010" } { setw window-active-style "bg=#272727" ; setw pane-active-border-style "fg=#14ba19, bg=#101010" }'
set -g status-style "bg=#101010"
setw -g pane-active-border-style "fg=#14ba19, bg=#101010"
setw -g pane-border-style "fg=#949494, bg=#101010"
setw -g message-style "fg=#949494, bg=#101010, fill=#101010"
set -g message-command-style "fg=#949494, bg=#101010, fill=#101010"
setw -g copy-mode-position-style "fg=#ffffff,bg=#858585"
set -g prompt-cursor-colour "#ffffff"
setw -g copy-mode-line-number-style "fg=#949494,dim"
setw -g copy-mode-current-line-number-style "fg=#ff7676,bold"
setw -g window-active-style "bg=#101010"
setw -g window-style "bg=#101010"
set -g window-status-current-style "fg=#ff7676, bg=#101010"
set -g window-status-style "fg=#ffffff, bg=#101010"
set -g window-status-last-style "fg=#ffffff, bg=#101010"
set -g window-status-activity-style "fg=#ffffff, bg=#101010"
set -g window-status-bell-style "fg=#949494, bg=#101010, bold"
