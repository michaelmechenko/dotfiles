# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#1d1b20"
set -g @color-surface-active "#211f26"
set -g @color-surface-chrome "#2b292f"
set -g @color-surface-highlight "#36343b"
set -g @color-divider "#2b292f"
set -g @color-copy-indicator "#757080"
set -g @color-text "#e6e0e9"
set -g @color-text-ui "#e6e0e9"
set -g @color-text-muted "#847f8f"
set -g @color-text-default "#e6e0e9"
set -g @color-accent-primary "#d0bcff"
set -g @color-accent-secondary "#f2b8b5"
set -g @color-accent-tertiary "#efb8c8"
set -g @color-accent-highlight "#ccc2dc"
set -g @color-accent-info "#0f0d13"
set -g @color-accent-periwinkle "#141218"
set -g @color-accent-warn "#1d1b20"
set -g @color-accent-amber "#1d1b20"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#1d1b20" ; setw pane-active-border-style "fg=#f2b8b5, bg=#1d1b20" } { setw window-active-style "bg=#211f26" ; setw pane-active-border-style "fg=#f2b8b5, bg=#1d1b20" }'
set -g status-style "bg=#1d1b20"
setw -g pane-active-border-style "fg=#f2b8b5, bg=#1d1b20"
setw -g pane-border-style "fg=#847f8f, bg=#1d1b20"
setw -g message-style "fg=#847f8f, bg=#1d1b20, fill=#1d1b20"
set -g message-command-style "fg=#847f8f, bg=#1d1b20, fill=#1d1b20"
setw -g copy-mode-position-style "fg=#e6e0e9,bg=#757080"
set -g prompt-cursor-colour "#e6e0e9"
setw -g copy-mode-line-number-style "fg=#847f8f,dim"
setw -g copy-mode-current-line-number-style "fg=#ccc2dc,bold"
setw -g window-active-style "bg=#1d1b20"
setw -g window-style "bg=#1d1b20"
set -g window-status-current-style "fg=#ccc2dc, bg=#1d1b20"
set -g window-status-style "fg=#e6e0e9, bg=#1d1b20"
set -g window-status-last-style "fg=#e6e0e9, bg=#1d1b20"
set -g window-status-activity-style "fg=#e6e0e9, bg=#1d1b20"
set -g window-status-bell-style "fg=#847f8f, bg=#1d1b20, bold"
