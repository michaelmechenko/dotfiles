# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#292522"
set -g @color-surface-active "#233524"
set -g @color-surface-chrome "#253333"
set -g @color-surface-highlight "#422741"
set -g @color-divider "#253333"
set -g @color-copy-indicator "#403a36"
set -g @color-text "#ece1d7"
set -g @color-text-ui "#ece1d7"
set -g @color-text-muted "#403a36"
set -g @color-text-default "#ece1d7"
set -g @color-accent-primary "#e49b5d"
set -g @color-accent-secondary "#ebc06d"
set -g @color-accent-tertiary "#d47766"
set -g @color-accent-highlight "#7d2a2f"
set -g @color-accent-info "#8b7449"
set -g @color-accent-periwinkle "#bd8183"
set -g @color-accent-warn "#cf9bc2"
set -g @color-accent-amber "#c1a78e"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#292522" ; setw pane-active-border-style "fg=#ebc06d, bg=#292522" } { setw window-active-style "bg=#233524" ; setw pane-active-border-style "fg=#ebc06d, bg=#292522" }'
set -g status-style "bg=#292522"
setw -g pane-active-border-style "fg=#ebc06d, bg=#292522"
setw -g pane-border-style "fg=#403a36, bg=#292522"
setw -g message-style "fg=#403a36, bg=#292522, fill=#292522"
set -g message-command-style "fg=#403a36, bg=#292522, fill=#292522"
setw -g copy-mode-position-style "fg=#ece1d7,bg=#403a36"
set -g prompt-cursor-colour "#ece1d7"
setw -g copy-mode-line-number-style "fg=#403a36,dim"
setw -g copy-mode-current-line-number-style "fg=#7d2a2f,bold"
setw -g window-active-style "bg=#292522"
setw -g window-style "bg=#292522"
set -g window-status-current-style "fg=#7d2a2f, bg=#292522"
set -g window-status-style "fg=#ece1d7, bg=#292522"
set -g window-status-last-style "fg=#ece1d7, bg=#292522"
set -g window-status-activity-style "fg=#ece1d7, bg=#292522"
set -g window-status-bell-style "fg=#403a36, bg=#292522, bold"
