# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#131314"
set -g @color-surface-active "#18181a"
set -g @color-surface-chrome "#27272a"
set -g @color-surface-highlight "#353539"
set -g @color-divider "#27272a"
set -g @color-copy-indicator "#353539"
set -g @color-text "#fafafa"
set -g @color-text-ui "#fafafa"
set -g @color-text-muted "#353539"
set -g @color-text-default "#fafafa"
set -g @color-accent-primary "#f27306"
set -g @color-accent-secondary "#f2a50a"
set -g @color-accent-tertiary "#e08200"
set -g @color-accent-highlight "#c65c00"
set -g @color-accent-info "#f73e7c"
set -g @color-accent-periwinkle "#ff684b"
set -g @color-accent-warn "#d82b65"
set -g @color-accent-amber "#e05439"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#131314" ; setw pane-active-border-style "fg=#f2a50a, bg=#131314" } { setw window-active-style "bg=#18181a" ; setw pane-active-border-style "fg=#f2a50a, bg=#131314" }'
set -g status-style "bg=#131314"
setw -g pane-active-border-style "fg=#f2a50a, bg=#131314"
setw -g pane-border-style "fg=#353539, bg=#131314"
setw -g message-style "fg=#353539, bg=#131314, fill=#131314"
set -g message-command-style "fg=#353539, bg=#131314, fill=#131314"
setw -g copy-mode-position-style "fg=#fafafa,bg=#353539"
set -g prompt-cursor-colour "#fafafa"
setw -g copy-mode-line-number-style "fg=#353539,dim"
setw -g copy-mode-current-line-number-style "fg=#c65c00,bold"
setw -g window-active-style "bg=#131314"
setw -g window-style "bg=#131314"
set -g window-status-current-style "fg=#c65c00, bg=#131314"
set -g window-status-style "fg=#fafafa, bg=#131314"
set -g window-status-last-style "fg=#fafafa, bg=#131314"
set -g window-status-activity-style "fg=#fafafa, bg=#131314"
set -g window-status-bell-style "fg=#353539, bg=#131314, bold"
