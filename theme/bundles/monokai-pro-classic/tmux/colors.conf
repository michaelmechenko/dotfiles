# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#161613"
set -g @color-surface-active "#1d1e19"
set -g @color-surface-chrome "#272822"
set -g @color-surface-highlight "#3b3c35"
set -g @color-divider "#272822"
set -g @color-copy-indicator "#3b3c35"
set -g @color-text "#fdfff1"
set -g @color-text-ui "#fdfff1"
set -g @color-text-muted "#3b3c35"
set -g @color-text-default "#fdfff1"
set -g @color-accent-primary "#fd971f"
set -g @color-accent-secondary "#f92672"
set -g @color-accent-tertiary "#a6e22e"
set -g @color-accent-highlight "#66d9ef"
set -g @color-accent-info "#ae81ff"
set -g @color-accent-periwinkle "#e6db74"
set -g @color-accent-warn "#161613"
set -g @color-accent-amber "#1d1e19"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#161613" ; setw pane-active-border-style "fg=#f92672, bg=#161613" } { setw window-active-style "bg=#1d1e19" ; setw pane-active-border-style "fg=#f92672, bg=#161613" }'
set -g status-style "bg=#161613"
setw -g pane-active-border-style "fg=#f92672, bg=#161613"
setw -g pane-border-style "fg=#3b3c35, bg=#161613"
setw -g message-style "fg=#3b3c35, bg=#161613, fill=#161613"
set -g message-command-style "fg=#3b3c35, bg=#161613, fill=#161613"
setw -g copy-mode-position-style "fg=#fdfff1,bg=#3b3c35"
set -g prompt-cursor-colour "#fdfff1"
setw -g copy-mode-line-number-style "fg=#3b3c35,dim"
setw -g copy-mode-current-line-number-style "fg=#66d9ef,bold"
setw -g window-active-style "bg=#161613"
setw -g window-style "bg=#161613"
set -g window-status-current-style "fg=#66d9ef, bg=#161613"
set -g window-status-style "fg=#fdfff1, bg=#161613"
set -g window-status-last-style "fg=#fdfff1, bg=#161613"
set -g window-status-activity-style "fg=#fdfff1, bg=#161613"
set -g window-status-bell-style "fg=#3b3c35, bg=#161613, bold"
