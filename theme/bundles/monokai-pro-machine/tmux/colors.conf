# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#161b1e"
set -g @color-surface-active "#1d2528"
set -g @color-surface-chrome "#273136"
set -g @color-surface-highlight "#3a4449"
set -g @color-divider "#273136"
set -g @color-copy-indicator "#3a4449"
set -g @color-text "#f2fffc"
set -g @color-text-ui "#f2fffc"
set -g @color-text-muted "#3a4449"
set -g @color-text-default "#f2fffc"
set -g @color-accent-primary "#ff6d7e"
set -g @color-accent-secondary "#ffb270"
set -g @color-accent-tertiary "#ffed72"
set -g @color-accent-highlight "#7cd5f1"
set -g @color-accent-info "#a2e57b"
set -g @color-accent-periwinkle "#baa0f8"
set -g @color-accent-warn "#161b1e"
set -g @color-accent-amber "#1d2528"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#161b1e" ; setw pane-active-border-style "fg=#ffb270, bg=#161b1e" } { setw window-active-style "bg=#1d2528" ; setw pane-active-border-style "fg=#ffb270, bg=#161b1e" }'
set -g status-style "bg=#161b1e"
setw -g pane-active-border-style "fg=#ffb270, bg=#161b1e"
setw -g pane-border-style "fg=#3a4449, bg=#161b1e"
setw -g message-style "fg=#3a4449, bg=#161b1e, fill=#161b1e"
set -g message-command-style "fg=#3a4449, bg=#161b1e, fill=#161b1e"
setw -g copy-mode-position-style "fg=#f2fffc,bg=#3a4449"
set -g prompt-cursor-colour "#f2fffc"
setw -g copy-mode-line-number-style "fg=#3a4449,dim"
setw -g copy-mode-current-line-number-style "fg=#7cd5f1,bold"
setw -g window-active-style "bg=#161b1e"
setw -g window-style "bg=#161b1e"
set -g window-status-current-style "fg=#7cd5f1, bg=#161b1e"
set -g window-status-style "fg=#f2fffc, bg=#161b1e"
set -g window-status-last-style "fg=#f2fffc, bg=#161b1e"
set -g window-status-activity-style "fg=#f2fffc, bg=#161b1e"
set -g window-status-bell-style "fg=#3a4449, bg=#161b1e, bold"
