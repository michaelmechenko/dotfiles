# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#161821"
set -g @color-surface-active "#1e1f2b"
set -g @color-surface-chrome "#282a3a"
set -g @color-surface-highlight "#3a3d4b"
set -g @color-divider "#282a3a"
set -g @color-copy-indicator "#6d738d"
set -g @color-text "#eaf2f1"
set -g @color-text-ui "#eaf2f1"
set -g @color-text-muted "#7e839b"
set -g @color-text-default "#eaf2f1"
set -g @color-accent-primary "#ff9b5e"
set -g @color-accent-secondary "#ff657a"
set -g @color-accent-tertiary "#ffd76d"
set -g @color-accent-highlight "#bad761"
set -g @color-accent-info "#9cd1bb"
set -g @color-accent-periwinkle "#c39ac9"
set -g @color-accent-warn "#161821"
set -g @color-accent-amber "#161821"
set -g @color-surface-inactive "#0f1117"
set -g @color-surface-pane-active "#1d1e2a"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#161821" ; setw pane-active-border-style "fg=#ff657a, bg=#161821" } { setw window-active-style "bg=#1d1e2a" ; setw pane-active-border-style "fg=#ff657a, bg=#161821" }'
set -g status-style "bg=#161821"
setw -g pane-active-border-style "fg=#ff657a, bg=#161821"
setw -g pane-border-style "fg=#7e839b, bg=#161821"
setw -g message-style "fg=#7e839b, bg=#161821, fill=#161821"
set -g message-command-style "fg=#7e839b, bg=#161821, fill=#161821"
setw -g copy-mode-position-style "fg=#eaf2f1,bg=#6d738d"
set -g prompt-cursor-colour "#eaf2f1"
setw -g copy-mode-line-number-style "fg=#7e839b,dim"
setw -g copy-mode-current-line-number-style "fg=#bad761,bold"
setw -g window-active-style "bg=#161821"
if -F '#{==:#{version},next-3.8}' 'setw -g window-style "bg=#0f1117,dim=20%"' 'setw -g window-style "bg=#0f1117"'
set -g window-status-current-style "fg=#bad761, bg=#161821"
set -g window-status-style "fg=#eaf2f1, bg=#161821"
set -g window-status-last-style "fg=#eaf2f1, bg=#161821"
set -g window-status-activity-style "fg=#eaf2f1, bg=#161821"
set -g window-status-bell-style "fg=#7e839b, bg=#161821, bold"
