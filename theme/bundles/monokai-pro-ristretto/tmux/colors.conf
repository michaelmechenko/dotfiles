# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#191515"
set -g @color-surface-active "#211c1c"
set -g @color-surface-chrome "#2c2525"
set -g @color-surface-highlight "#403838"
set -g @color-divider "#2c2525"
set -g @color-copy-indicator "#7b6c6c"
set -g @color-text "#fff1f3"
set -g @color-text-ui "#fff1f3"
set -g @color-text-muted "#8b7b7b"
set -g @color-text-default "#fff1f3"
set -g @color-accent-primary "#fd6883"
set -g @color-accent-secondary "#f9cc6c"
set -g @color-accent-tertiary "#f38d70"
set -g @color-accent-highlight "#adda78"
set -g @color-accent-info "#85dacc"
set -g @color-accent-periwinkle "#a8a9eb"
set -g @color-accent-warn "#191515"
set -g @color-accent-amber "#191515"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#191515" ; setw pane-active-border-style "fg=#f9cc6c, bg=#191515" } { setw window-active-style "bg=#211c1c" ; setw pane-active-border-style "fg=#f9cc6c, bg=#191515" }'
set -g status-style "bg=#191515"
setw -g pane-active-border-style "fg=#f9cc6c, bg=#191515"
setw -g pane-border-style "fg=#8b7b7b, bg=#191515"
setw -g message-style "fg=#8b7b7b, bg=#191515, fill=#191515"
set -g message-command-style "fg=#8b7b7b, bg=#191515, fill=#191515"
setw -g copy-mode-position-style "fg=#fff1f3,bg=#7b6c6c"
set -g prompt-cursor-colour "#fff1f3"
setw -g copy-mode-line-number-style "fg=#8b7b7b,dim"
setw -g copy-mode-current-line-number-style "fg=#adda78,bold"
setw -g window-active-style "bg=#191515"
setw -g window-style "bg=#191515"
set -g window-status-current-style "fg=#adda78, bg=#191515"
set -g window-status-style "fg=#fff1f3, bg=#191515"
set -g window-status-last-style "fg=#fff1f3, bg=#191515"
set -g window-status-activity-style "fg=#fff1f3, bg=#191515"
set -g window-status-bell-style "fg=#8b7b7b, bg=#191515, bold"
