# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#131313"
set -g @color-surface-active "#191919"
set -g @color-surface-chrome "#222222"
set -g @color-surface-highlight "#363537"
set -g @color-divider "#222222"
set -g @color-copy-indicator "#6d6b6f"
set -g @color-text "#f7f1ff"
set -g @color-text-ui "#f7f1ff"
set -g @color-text-muted "#7c7a7f"
set -g @color-text-default "#f7f1ff"
set -g @color-accent-primary "#fd9353"
set -g @color-accent-secondary "#fc618d"
set -g @color-accent-tertiary "#fce566"
set -g @color-accent-highlight "#5ad4e6"
set -g @color-accent-info "#7bd88f"
set -g @color-accent-periwinkle "#948ae3"
set -g @color-accent-warn "#131313"
set -g @color-accent-amber "#131313"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#131313" ; setw pane-active-border-style "fg=#fc618d, bg=#131313" } { setw window-active-style "bg=#191919" ; setw pane-active-border-style "fg=#fc618d, bg=#131313" }'
set -g status-style "bg=#131313"
setw -g pane-active-border-style "fg=#fc618d, bg=#131313"
setw -g pane-border-style "fg=#7c7a7f, bg=#131313"
setw -g message-style "fg=#7c7a7f, bg=#131313, fill=#131313"
set -g message-command-style "fg=#7c7a7f, bg=#131313, fill=#131313"
setw -g copy-mode-position-style "fg=#f7f1ff,bg=#6d6b6f"
set -g prompt-cursor-colour "#f7f1ff"
setw -g copy-mode-line-number-style "fg=#7c7a7f,dim"
setw -g copy-mode-current-line-number-style "fg=#5ad4e6,bold"
setw -g window-active-style "bg=#131313"
setw -g window-style "bg=#131313"
set -g window-status-current-style "fg=#5ad4e6, bg=#131313"
set -g window-status-style "fg=#f7f1ff, bg=#131313"
set -g window-status-last-style "fg=#f7f1ff, bg=#131313"
set -g window-status-activity-style "fg=#f7f1ff, bg=#131313"
set -g window-status-bell-style "fg=#7c7a7f, bg=#131313, bold"
