# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#19181a"
set -g @color-surface-active "#221f22"
set -g @color-surface-chrome "#2d2a2e"
set -g @color-surface-highlight "#403e41"
set -g @color-divider "#2d2a2e"
set -g @color-copy-indicator "#767278"
set -g @color-text "#fcfcfa"
set -g @color-text-ui "#fcfcfa"
set -g @color-text-muted "#858187"
set -g @color-text-default "#fcfcfa"
set -g @color-accent-primary "#ff6188"
set -g @color-accent-secondary "#ffd866"
set -g @color-accent-tertiary "#fc9867"
set -g @color-accent-highlight "#78dce8"
set -g @color-accent-info "#a9dc76"
set -g @color-accent-periwinkle "#ab9df2"
set -g @color-accent-warn "#19181a"
set -g @color-accent-amber "#19181a"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#19181a" ; setw pane-active-border-style "fg=#ffd866, bg=#19181a" } { setw window-active-style "bg=#221f22" ; setw pane-active-border-style "fg=#ffd866, bg=#19181a" }'
set -g status-style "bg=#19181a"
setw -g pane-active-border-style "fg=#ffd866, bg=#19181a"
setw -g pane-border-style "fg=#858187, bg=#19181a"
setw -g message-style "fg=#858187, bg=#19181a, fill=#19181a"
set -g message-command-style "fg=#858187, bg=#19181a, fill=#19181a"
setw -g copy-mode-position-style "fg=#fcfcfa,bg=#767278"
set -g prompt-cursor-colour "#fcfcfa"
setw -g copy-mode-line-number-style "fg=#858187,dim"
setw -g copy-mode-current-line-number-style "fg=#78dce8,bold"
setw -g window-active-style "bg=#19181a"
setw -g window-style "bg=#19181a"
set -g window-status-current-style "fg=#78dce8, bg=#19181a"
set -g window-status-style "fg=#fcfcfa, bg=#19181a"
set -g window-status-last-style "fg=#fcfcfa, bg=#19181a"
set -g window-status-activity-style "fg=#fcfcfa, bg=#19181a"
set -g window-status-bell-style "fg=#858187, bg=#19181a, bold"
