# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#191919"
set -g @color-surface-active "#222222"
set -g @color-surface-chrome "#363636"
set -g @color-surface-highlight "#2f4243"
set -g @color-divider "#363636"
set -g @color-copy-indicator "#2f4243"
set -g @color-text "#f0f0f0"
set -g @color-text-ui "#f0f0f0"
set -g @color-text-muted "#2f4243"
set -g @color-text-default "#f0f0f0"
set -g @color-accent-primary "#ac8aac"
set -g @color-accent-secondary "#8aabac"
set -g @color-accent-tertiary "#aca98a"
set -g @color-accent-highlight "#ac9d8a"
set -g @color-accent-info "#8f8aac"
set -g @color-accent-periwinkle "#ac8a8c"
set -g @color-accent-warn "#8aac8b"
set -g @color-accent-amber "#191919"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#191919" ; setw pane-active-border-style "fg=#8aabac, bg=#191919" } { setw window-active-style "bg=#222222" ; setw pane-active-border-style "fg=#8aabac, bg=#191919" }'
set -g status-style "bg=#191919"
setw -g pane-active-border-style "fg=#8aabac, bg=#191919"
setw -g pane-border-style "fg=#2f4243, bg=#191919"
setw -g message-style "fg=#2f4243, bg=#191919, fill=#191919"
set -g message-command-style "fg=#2f4243, bg=#191919, fill=#191919"
setw -g copy-mode-position-style "fg=#f0f0f0,bg=#2f4243"
set -g prompt-cursor-colour "#f0f0f0"
setw -g copy-mode-line-number-style "fg=#2f4243,dim"
setw -g copy-mode-current-line-number-style "fg=#ac9d8a,bold"
setw -g window-active-style "bg=#191919"
setw -g window-style "bg=#191919"
set -g window-status-current-style "fg=#ac9d8a, bg=#191919"
set -g window-status-style "fg=#f0f0f0, bg=#191919"
set -g window-status-last-style "fg=#f0f0f0, bg=#191919"
set -g window-status-activity-style "fg=#f0f0f0, bg=#191919"
set -g window-status-bell-style "fg=#2f4243, bg=#191919, bold"
