# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#050505"
set -g @color-surface-active "#0f0f0f"
set -g @color-surface-chrome "#222222"
set -g @color-surface-highlight "#363636"
set -g @color-divider "#222222"
set -g @color-copy-indicator "#363636"
set -g @color-text "#f0f0f0"
set -g @color-text-ui "#f0f0f0"
set -g @color-text-muted "#363636"
set -g @color-text-default "#f0f0f0"
set -g @color-accent-primary "#ac8aac"
set -g @color-accent-secondary "#8aabac"
set -g @color-accent-tertiary "#aca98a"
set -g @color-accent-highlight "#ac9d8a"
set -g @color-accent-info "#8f8aac"
set -g @color-accent-periwinkle "#ac8a8c"
set -g @color-accent-warn "#8aac8b"
set -g @color-accent-amber "#050505"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#050505" ; setw pane-active-border-style "fg=#8aabac, bg=#050505" } { setw window-active-style "bg=#0f0f0f" ; setw pane-active-border-style "fg=#8aabac, bg=#050505" }'
set -g status-style "bg=#050505"
setw -g pane-active-border-style "fg=#8aabac, bg=#050505"
setw -g pane-border-style "fg=#363636, bg=#050505"
setw -g message-style "fg=#363636, bg=#050505, fill=#050505"
set -g message-command-style "fg=#363636, bg=#050505, fill=#050505"
setw -g copy-mode-position-style "fg=#f0f0f0,bg=#363636"
set -g prompt-cursor-colour "#f0f0f0"
setw -g copy-mode-line-number-style "fg=#363636,dim"
setw -g copy-mode-current-line-number-style "fg=#ac9d8a,bold"
setw -g window-active-style "bg=#050505"
setw -g window-style "bg=#050505"
set -g window-status-current-style "fg=#ac9d8a, bg=#050505"
set -g window-status-style "fg=#f0f0f0, bg=#050505"
set -g window-status-last-style "fg=#f0f0f0, bg=#050505"
set -g window-status-activity-style "fg=#f0f0f0, bg=#050505"
set -g window-status-bell-style "fg=#363636, bg=#050505, bold"
