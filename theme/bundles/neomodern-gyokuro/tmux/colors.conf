# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#1b1c1d"
set -g @color-surface-active "#1e251d"
set -g @color-surface-chrome "#26313b"
set -g @color-surface-highlight "#868db5"
set -g @color-divider "#748fa6"
set -g @color-copy-indicator "#a6acc9"
set -g @color-text "#fffff0"
set -g @color-text-ui "#fffff0"
set -g @color-text-muted "#a6acc9"
set -g @color-text-default "#fffff0"
set -g @color-accent-primary "#a69e6f"
set -g @color-accent-secondary "#b08c7d"
set -g @color-accent-tertiary "#748fa6"
set -g @color-accent-highlight "#868db5"
set -g @color-accent-info "#d6a9b3"
set -g @color-accent-periwinkle "#799475"
set -g @color-accent-warn "#fffff0"
set -g @color-accent-amber "#fffff0"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#1b1c1d" ; setw pane-active-border-style "fg=#b08c7d, bg=#1b1c1d" } { setw window-active-style "bg=#1e251d" ; setw pane-active-border-style "fg=#b08c7d, bg=#1b1c1d" }'
set -g status-style "bg=#1b1c1d"
setw -g pane-active-border-style "fg=#b08c7d, bg=#1b1c1d"
setw -g pane-border-style "fg=#a6acc9, bg=#1b1c1d"
setw -g message-style "fg=#a6acc9, bg=#1b1c1d, fill=#1b1c1d"
set -g message-command-style "fg=#a6acc9, bg=#1b1c1d, fill=#1b1c1d"
setw -g copy-mode-position-style "fg=#fffff0,bg=#a6acc9"
set -g prompt-cursor-colour "#fffff0"
setw -g copy-mode-line-number-style "fg=#a6acc9,dim"
setw -g copy-mode-current-line-number-style "fg=#868db5,bold"
setw -g window-active-style "bg=#1b1c1d"
setw -g window-style "bg=#1b1c1d"
set -g window-status-current-style "fg=#868db5, bg=#1b1c1d"
set -g window-status-style "fg=#fffff0, bg=#1b1c1d"
set -g window-status-last-style "fg=#fffff0, bg=#1b1c1d"
set -g window-status-activity-style "fg=#fffff0, bg=#1b1c1d"
set -g window-status-bell-style "fg=#a6acc9, bg=#1b1c1d, bold"
