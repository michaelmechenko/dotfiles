# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#171614"
set -g @color-surface-active "#4f4c4c"
set -g @color-surface-chrome "#454036"
set -g @color-surface-highlight "#8a7f76"
set -g @color-divider "#9e6057"
set -g @color-copy-indicator "#bdb7b2"
set -g @color-text "#ffeaea"
set -g @color-text-ui "#ffeaea"
set -g @color-text-muted "#bdb7b2"
set -g @color-text-default "#ffeaea"
set -g @color-accent-primary "#9e6057"
set -g @color-accent-secondary "#ab836c"
set -g @color-accent-tertiary "#b0a582"
set -g @color-accent-highlight "#ffeaea"
set -g @color-accent-info "#171614"
set -g @color-accent-periwinkle "#9e6057"
set -g @color-accent-warn "#717d6e"
set -g @color-accent-amber "#b0a582"
set -g @color-surface-inactive "#11100e"
set -g @color-surface-pane-active "#1a1918"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#171614" ; setw pane-active-border-style "fg=#ab836c, bg=#171614" } { setw window-active-style "bg=#1a1918" ; setw pane-active-border-style "fg=#ab836c, bg=#171614" }'
set -g status-style "bg=#171614"
setw -g pane-active-border-style "fg=#ab836c, bg=#171614"
setw -g pane-border-style "fg=#bdb7b2, bg=#171614"
setw -g message-style "fg=#bdb7b2, bg=#171614, fill=#171614"
set -g message-command-style "fg=#bdb7b2, bg=#171614, fill=#171614"
setw -g copy-mode-position-style "fg=#ffeaea,bg=#bdb7b2"
set -g prompt-cursor-colour "#ffeaea"
setw -g copy-mode-line-number-style "fg=#bdb7b2,dim"
setw -g copy-mode-current-line-number-style "fg=#ffeaea,bold"
setw -g window-active-style "bg=#171614"
if -F '#{==:#{version},next-3.8}' 'setw -g window-style "bg=#11100e,dim=20%"' 'setw -g window-style "bg=#11100e"'
set -g window-status-current-style "fg=#ffeaea, bg=#171614"
set -g window-status-style "fg=#ffeaea, bg=#171614"
set -g window-status-last-style "fg=#ffeaea, bg=#171614"
set -g window-status-activity-style "fg=#ffeaea, bg=#171614"
set -g window-status-bell-style "fg=#bdb7b2, bg=#171614, bold"
