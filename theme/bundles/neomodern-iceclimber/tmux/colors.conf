# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#171719"
set -g @color-surface-active "#1a2628"
set -g @color-surface-chrome "#2a3732"
set -g @color-surface-highlight "#353540"
set -g @color-divider "#90aba0"
set -g @color-copy-indicator "#d5ad9a"
set -g @color-text "#e9e9ff"
set -g @color-text-ui "#e9e9ff"
set -g @color-text-muted "#d5ad9a"
set -g @color-text-default "#e9e9ff"
set -g @color-accent-primary "#87a1e6"
set -g @color-accent-secondary "#8a88d1"
set -g @color-accent-tertiary "#cfa18c"
set -g @color-accent-highlight "#cf9dbd"
set -g @color-accent-info "#6a969c"
set -g @color-accent-periwinkle "#90aba0"
set -g @color-accent-warn "#e9e9ff"
set -g @color-accent-amber "#e9e9ff"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#171719" ; setw pane-active-border-style "fg=#8a88d1, bg=#171719" } { setw window-active-style "bg=#1a2628" ; setw pane-active-border-style "fg=#8a88d1, bg=#171719" }'
set -g status-style "bg=#171719"
setw -g pane-active-border-style "fg=#8a88d1, bg=#171719"
setw -g pane-border-style "fg=#d5ad9a, bg=#171719"
setw -g message-style "fg=#d5ad9a, bg=#171719, fill=#171719"
set -g message-command-style "fg=#d5ad9a, bg=#171719, fill=#171719"
setw -g copy-mode-position-style "fg=#e9e9ff,bg=#d5ad9a"
set -g prompt-cursor-colour "#e9e9ff"
setw -g copy-mode-line-number-style "fg=#d5ad9a,dim"
setw -g copy-mode-current-line-number-style "fg=#cf9dbd,bold"
setw -g window-active-style "bg=#171719"
setw -g window-style "bg=#171719"
set -g window-status-current-style "fg=#cf9dbd, bg=#171719"
set -g window-status-style "fg=#e9e9ff, bg=#171719"
set -g window-status-last-style "fg=#e9e9ff, bg=#171719"
set -g window-status-activity-style "fg=#e9e9ff, bg=#171719"
set -g window-status-bell-style "fg=#d5ad9a, bg=#171719, bold"
