# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#151515"
set -g @color-surface-active "#4c4c57"
set -g @color-surface-chrome "#2f322f"
set -g @color-surface-highlight "#3e3838"
set -g @color-divider "#777d77"
set -g @color-copy-indicator "#bab5ba"
set -g @color-text "#eeeeff"
set -g @color-text-ui "#eeeeff"
set -g @color-text-muted "#bab5ba"
set -g @color-text-default "#eeeeff"
set -g @color-accent-primary "#b39066"
set -g @color-accent-secondary "#7a8aa6"
set -g @color-accent-tertiary "#6d748c"
set -g @color-accent-highlight "#eeeeff"
set -g @color-accent-info "#151515"
set -g @color-accent-periwinkle "#b39066"
set -g @color-accent-warn "#777d77"
set -g @color-accent-amber "#b5b3a5"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#151515" ; setw pane-active-border-style "fg=#7a8aa6, bg=#151515" } { setw window-active-style "bg=#4c4c57" ; setw pane-active-border-style "fg=#7a8aa6, bg=#151515" }'
set -g status-style "bg=#151515"
setw -g pane-active-border-style "fg=#7a8aa6, bg=#151515"
setw -g pane-border-style "fg=#bab5ba, bg=#151515"
setw -g message-style "fg=#bab5ba, bg=#151515, fill=#151515"
set -g message-command-style "fg=#bab5ba, bg=#151515, fill=#151515"
setw -g copy-mode-position-style "fg=#eeeeff,bg=#bab5ba"
set -g prompt-cursor-colour "#eeeeff"
setw -g copy-mode-line-number-style "fg=#bab5ba,dim"
setw -g copy-mode-current-line-number-style "fg=#eeeeff,bold"
setw -g window-active-style "bg=#151515"
setw -g window-style "bg=#151515"
set -g window-status-current-style "fg=#eeeeff, bg=#151515"
set -g window-status-style "fg=#eeeeff, bg=#151515"
set -g window-status-last-style "fg=#eeeeff, bg=#151515"
set -g window-status-activity-style "fg=#eeeeff, bg=#151515"
set -g window-status-bell-style "fg=#bab5ba, bg=#151515, bold"
