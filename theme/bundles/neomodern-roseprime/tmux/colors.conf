# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#141517"
set -g @color-surface-active "#5f86b0"
set -g @color-surface-chrome "#c4959c"
set -g @color-surface-highlight "#c9aa95"
set -g @color-divider "#c4959c"
set -g @color-copy-indicator "#9bbdb8"
set -g @color-text "#ffecff"
set -g @color-text-ui "#ffecff"
set -g @color-text-muted "#9bbdb8"
set -g @color-text-default "#ffecff"
set -g @color-accent-primary "#96aff2"
set -g @color-accent-secondary "#5f86b0"
set -g @color-accent-tertiary "#a6a4eb"
set -g @color-accent-highlight "#c9aa95"
set -g @color-accent-info "#c4959c"
set -g @color-accent-periwinkle "#9bbdb8"
set -g @color-accent-warn "#ffecff"
set -g @color-accent-amber "#141517"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#141517" ; setw pane-active-border-style "fg=#5f86b0, bg=#141517" } { setw window-active-style "bg=#5f86b0" ; setw pane-active-border-style "fg=#5f86b0, bg=#141517" }'
set -g status-style "bg=#141517"
setw -g pane-active-border-style "fg=#5f86b0, bg=#141517"
setw -g pane-border-style "fg=#9bbdb8, bg=#141517"
setw -g message-style "fg=#9bbdb8, bg=#141517, fill=#141517"
set -g message-command-style "fg=#9bbdb8, bg=#141517, fill=#141517"
setw -g copy-mode-position-style "fg=#ffecff,bg=#9bbdb8"
set -g prompt-cursor-colour "#ffecff"
setw -g copy-mode-line-number-style "fg=#9bbdb8,dim"
setw -g copy-mode-current-line-number-style "fg=#c9aa95,bold"
setw -g window-active-style "bg=#141517"
setw -g window-style "bg=#141517"
set -g window-status-current-style "fg=#c9aa95, bg=#141517"
set -g window-status-style "fg=#ffecff, bg=#141517"
set -g window-status-last-style "fg=#ffecff, bg=#141517"
set -g window-status-activity-style "fg=#ffecff, bg=#141517"
set -g window-status-bell-style "fg=#9bbdb8, bg=#141517, bold"
