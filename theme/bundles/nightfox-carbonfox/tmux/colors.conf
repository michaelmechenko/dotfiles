# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#161616"
set -g @color-surface-active "#282828"
set -g @color-surface-chrome "#525253"
set -g @color-surface-highlight "#25be6a"
set -g @color-divider "#525253"
set -g @color-copy-indicator "#525253"
set -g @color-text "#f2f4f8"
set -g @color-text-ui "#f2f4f8"
set -g @color-text-muted "#525253"
set -g @color-text-default "#f2f4f8"
set -g @color-accent-primary "#33b1ff"
set -g @color-accent-secondary "#08bdba"
set -g @color-accent-tertiary "#3ddbd9"
set -g @color-accent-highlight "#ee5396"
set -g @color-accent-info "#25be6a"
set -g @color-accent-periwinkle "#78a9ff"
set -g @color-accent-warn "#ff7eb6"
set -g @color-accent-amber "#42be65"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#161616" ; setw pane-active-border-style "fg=#08bdba, bg=#161616" } { setw window-active-style "bg=#282828" ; setw pane-active-border-style "fg=#08bdba, bg=#161616" }'
set -g status-style "bg=#161616"
setw -g pane-active-border-style "fg=#08bdba, bg=#161616"
setw -g pane-border-style "fg=#525253, bg=#161616"
setw -g message-style "fg=#525253, bg=#161616, fill=#161616"
set -g message-command-style "fg=#525253, bg=#161616, fill=#161616"
setw -g copy-mode-position-style "fg=#f2f4f8,bg=#525253"
set -g prompt-cursor-colour "#f2f4f8"
setw -g copy-mode-line-number-style "fg=#525253,dim"
setw -g copy-mode-current-line-number-style "fg=#ee5396,bold"
setw -g window-active-style "bg=#161616"
setw -g window-style "bg=#161616"
set -g window-status-current-style "fg=#ee5396, bg=#161616"
set -g window-status-style "fg=#f2f4f8, bg=#161616"
set -g window-status-last-style "fg=#f2f4f8, bg=#161616"
set -g window-status-activity-style "fg=#f2f4f8, bg=#161616"
set -g window-status-bell-style "fg=#525253, bg=#161616, bold"
