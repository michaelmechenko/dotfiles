# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#191726"
set -g @color-surface-active "#232136"
set -g @color-surface-chrome "#2d2a45"
set -g @color-surface-highlight "#373354"
set -g @color-divider "#2d2a45"
set -g @color-copy-indicator "#393552"
set -g @color-text "#eae8ff"
set -g @color-text-ui "#eae8ff"
set -g @color-text-muted "#393552"
set -g @color-text-default "#eae8ff"
set -g @color-accent-primary "#e6a852"
set -g @color-accent-secondary "#d84f76"
set -g @color-accent-tertiary "#f6c177"
set -g @color-accent-highlight "#eb6f92"
set -g @color-accent-info "#f9cb8c"
set -g @color-accent-periwinkle "#f083a2"
set -g @color-accent-warn "#65b1cd"
set -g @color-accent-amber "#d871a6"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#191726" ; setw pane-active-border-style "fg=#d84f76, bg=#191726" } { setw window-active-style "bg=#232136" ; setw pane-active-border-style "fg=#d84f76, bg=#191726" }'
set -g status-style "bg=#191726"
setw -g pane-active-border-style "fg=#d84f76, bg=#191726"
setw -g pane-border-style "fg=#393552, bg=#191726"
setw -g message-style "fg=#393552, bg=#191726, fill=#191726"
set -g message-command-style "fg=#393552, bg=#191726, fill=#191726"
setw -g copy-mode-position-style "fg=#eae8ff,bg=#393552"
set -g prompt-cursor-colour "#eae8ff"
setw -g copy-mode-line-number-style "fg=#393552,dim"
setw -g copy-mode-current-line-number-style "fg=#eb6f92,bold"
setw -g window-active-style "bg=#191726"
setw -g window-style "bg=#191726"
set -g window-status-current-style "fg=#eb6f92, bg=#191726"
set -g window-status-style "fg=#eae8ff, bg=#191726"
set -g window-status-last-style "fg=#eae8ff, bg=#191726"
set -g window-status-activity-style "fg=#eae8ff, bg=#191726"
set -g window-status-bell-style "fg=#393552, bg=#191726, bold"
