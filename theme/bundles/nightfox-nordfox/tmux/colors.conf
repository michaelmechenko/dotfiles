# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#232831"
set -g @color-surface-active "#2e3440"
set -g @color-surface-chrome "#353a45"
set -g @color-surface-highlight "#39404f"
set -g @color-divider "#353a45"
set -g @color-copy-indicator "#78839e"
set -g @color-text "#e7ecf4"
set -g @color-text-ui "#e7ecf4"
set -g @color-text-muted "#8a93ab"
set -g @color-text-default "#e7ecf4"
set -g @color-accent-primary "#d9b263"
set -g @color-accent-secondary "#b46950"
set -g @color-accent-tertiary "#d06f79"
set -g @color-accent-highlight "#ebcb8b"
set -g @color-accent-info "#d89079"
set -g @color-accent-periwinkle "#c9826b"
set -g @color-accent-warn "#bf616a"
set -g @color-accent-amber "#f0d399"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#232831" ; setw pane-active-border-style "fg=#b46950, bg=#232831" } { setw window-active-style "bg=#2e3440" ; setw pane-active-border-style "fg=#b46950, bg=#232831" }'
set -g status-style "bg=#232831"
setw -g pane-active-border-style "fg=#b46950, bg=#232831"
setw -g pane-border-style "fg=#8a93ab, bg=#232831"
setw -g message-style "fg=#8a93ab, bg=#232831, fill=#232831"
set -g message-command-style "fg=#8a93ab, bg=#232831, fill=#232831"
setw -g copy-mode-position-style "fg=#e7ecf4,bg=#78839e"
set -g prompt-cursor-colour "#e7ecf4"
setw -g copy-mode-line-number-style "fg=#8a93ab,dim"
setw -g copy-mode-current-line-number-style "fg=#ebcb8b,bold"
setw -g window-active-style "bg=#232831"
setw -g window-style "bg=#232831"
set -g window-status-current-style "fg=#ebcb8b, bg=#232831"
set -g window-status-style "fg=#e7ecf4, bg=#232831"
set -g window-status-last-style "fg=#e7ecf4, bg=#232831"
set -g window-status-activity-style "fg=#e7ecf4, bg=#232831"
set -g window-status-bell-style "fg=#8a93ab, bg=#232831, bold"
