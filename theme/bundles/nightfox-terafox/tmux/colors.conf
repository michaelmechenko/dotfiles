# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#0f1c1e"
set -g @color-surface-active "#152528"
set -g @color-surface-chrome "#282a30"
set -g @color-surface-highlight "#2f3239"
set -g @color-divider "#282a30"
set -g @color-copy-indicator "#507a7d"
set -g @color-text "#eeeeee"
set -g @color-text-ui "#eeeeee"
set -g @color-text-muted "#5c8c90"
set -g @color-text-default "#eeeeee"
set -g @color-accent-primary "#ff8349"
set -g @color-accent-secondary "#ff9664"
set -g @color-accent-tertiary "#d96f3e"
set -g @color-accent-highlight "#e85c51"
set -g @color-accent-info "#eb746b"
set -g @color-accent-periwinkle "#c54e45"
set -g @color-accent-warn "#fda47f"
set -g @color-accent-amber "#fdb292"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#0f1c1e" ; setw pane-active-border-style "fg=#ff9664, bg=#0f1c1e" } { setw window-active-style "bg=#152528" ; setw pane-active-border-style "fg=#ff9664, bg=#0f1c1e" }'
set -g status-style "bg=#0f1c1e"
setw -g pane-active-border-style "fg=#ff9664, bg=#0f1c1e"
setw -g pane-border-style "fg=#5c8c90, bg=#0f1c1e"
setw -g message-style "fg=#5c8c90, bg=#0f1c1e, fill=#0f1c1e"
set -g message-command-style "fg=#5c8c90, bg=#0f1c1e, fill=#0f1c1e"
setw -g copy-mode-position-style "fg=#eeeeee,bg=#507a7d"
set -g prompt-cursor-colour "#eeeeee"
setw -g copy-mode-line-number-style "fg=#5c8c90,dim"
setw -g copy-mode-current-line-number-style "fg=#e85c51,bold"
setw -g window-active-style "bg=#0f1c1e"
setw -g window-style "bg=#0f1c1e"
set -g window-status-current-style "fg=#e85c51, bg=#0f1c1e"
set -g window-status-style "fg=#eeeeee, bg=#0f1c1e"
set -g window-status-last-style "fg=#eeeeee, bg=#0f1c1e"
set -g window-status-activity-style "fg=#eeeeee, bg=#0f1c1e"
set -g window-status-bell-style "fg=#5c8c90, bg=#0f1c1e, bold"
