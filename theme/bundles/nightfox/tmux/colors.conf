# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#131a24"
set -g @color-surface-active "#192330"
set -g @color-surface-chrome "#212e3f"
set -g @color-surface-highlight "#29394f"
set -g @color-divider "#212e3f"
set -g @color-copy-indicator "#5677a6"
set -g @color-text "#dfdfe0"
set -g @color-text-ui "#dfdfe0"
set -g @color-text-muted "#6987b1"
set -g @color-text-default "#dfdfe0"
set -g @color-accent-primary "#f4a261"
set -g @color-accent-secondary "#c94f6d"
set -g @color-accent-tertiary "#63cdcf"
set -g @color-accent-highlight "#dbc074"
set -g @color-accent-info "#719cd6"
set -g @color-accent-periwinkle "#9d79d6"
set -g @color-accent-warn "#d67ad2"
set -g @color-accent-amber "#3c5372"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#131a24" ; setw pane-active-border-style "fg=#c94f6d, bg=#131a24" } { setw window-active-style "bg=#192330" ; setw pane-active-border-style "fg=#c94f6d, bg=#131a24" }'
set -g status-style "bg=#131a24"
setw -g pane-active-border-style "fg=#c94f6d, bg=#131a24"
setw -g pane-border-style "fg=#6987b1, bg=#131a24"
setw -g message-style "fg=#6987b1, bg=#131a24, fill=#131a24"
set -g message-command-style "fg=#6987b1, bg=#131a24, fill=#131a24"
setw -g copy-mode-position-style "fg=#dfdfe0,bg=#5677a6"
set -g prompt-cursor-colour "#dfdfe0"
setw -g copy-mode-line-number-style "fg=#6987b1,dim"
setw -g copy-mode-current-line-number-style "fg=#dbc074,bold"
setw -g window-active-style "bg=#131a24"
setw -g window-style "bg=#131a24"
set -g window-status-current-style "fg=#dbc074, bg=#131a24"
set -g window-status-style "fg=#dfdfe0, bg=#131a24"
set -g window-status-last-style "fg=#dfdfe0, bg=#131a24"
set -g window-status-activity-style "fg=#dfdfe0, bg=#131a24"
set -g window-status-bell-style "fg=#6987b1, bg=#131a24, bold"
