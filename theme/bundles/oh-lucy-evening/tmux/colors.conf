# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#1E1D23"
set -g @color-surface-active "#242329"
set -g @color-surface-chrome "#1A191E"
set -g @color-surface-highlight "#29292E"
set -g @color-divider "#2E2930"
set -g @color-copy-indicator "#7F737D"
set -g @color-text "#DED7D0"
set -g @color-text-ui "#DED7D0"
set -g @color-text-muted "#7F737D"
set -g @color-text-default "#DED7D0"
set -g @color-accent-primary "#FF7DA3"
set -g @color-accent-secondary "#B898DD"
set -g @color-accent-tertiary "#BDA9D4"
set -g @color-accent-highlight "#BBBBBB"
set -g @color-accent-info "#8BB8D0"
set -g @color-accent-periwinkle "#568BB4"
set -g @color-accent-warn "#E39A65"
set -g @color-accent-amber "#EFD472"
set -g @color-surface-inactive "#161519"
set -g @color-surface-pane-active "#212027"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#1e1d23" ; setw pane-active-border-style "fg=#b898dd, bg=#1e1d23" } { setw window-active-style "bg=#212027" ; setw pane-active-border-style "fg=#b898dd, bg=#1e1d23" }'
set -g status-style "bg=#1e1d23"
setw -g pane-active-border-style "fg=#b898dd, bg=#1e1d23"
setw -g pane-border-style "fg=#7f737d, bg=#1e1d23"
setw -g message-style "fg=#7f737d, bg=#1e1d23, fill=#1e1d23"
set -g message-command-style "fg=#7f737d, bg=#1e1d23, fill=#1e1d23"
setw -g copy-mode-position-style "fg=#ded7d0,bg=#7f737d"
set -g prompt-cursor-colour "#ded7d0"
setw -g copy-mode-line-number-style "fg=#7f737d,dim"
setw -g copy-mode-current-line-number-style "fg=#bbbbbb,bold"
setw -g window-active-style "bg=#1e1d23"
if -F '#{==:#{version},next-3.8}' 'setw -g window-style "bg=#161519,dim=20%"' 'setw -g window-style "bg=#161519"'
set -g window-status-current-style "fg=#bbbbbb, bg=#1e1d23"
set -g window-status-style "fg=#ded7d0, bg=#1e1d23"
set -g window-status-last-style "fg=#ded7d0, bg=#1e1d23"
set -g window-status-activity-style "fg=#ded7d0, bg=#1e1d23"
set -g window-status-bell-style "fg=#7f737d, bg=#1e1d23, bold"
