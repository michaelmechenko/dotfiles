# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#1B1D26"
set -g @color-surface-active "#21232C"
set -g @color-surface-chrome "#14161D"
set -g @color-surface-highlight "#272932"
set -g @color-divider "#21252D"
set -g @color-copy-indicator "#6E7380"
set -g @color-text "#D7D7D7"
set -g @color-text-ui "#D7D7D7"
set -g @color-text-muted "#7C7E8C"
set -g @color-text-default "#E9E9E9"
set -g @color-accent-primary "#FB7DA7"
set -g @color-accent-secondary "#AF98E6"
set -g @color-accent-tertiary "#BDA9D4"
set -g @color-accent-highlight "#BBBBBB"
set -g @color-accent-info "#8DBBD3"
set -g @color-accent-periwinkle "#568BB4"
set -g @color-accent-warn "#E39A65"
set -g @color-accent-amber "#E3CF65"
set -g @color-surface-inactive "#13151b"
set -g @color-surface-pane-active "#1e202a"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#1b1d26" ; setw pane-active-border-style "fg=#af98e6, bg=#1b1d26" } { setw window-active-style "bg=#1e202a" ; setw pane-active-border-style "fg=#af98e6, bg=#1b1d26" }'
set -g status-style "bg=#1b1d26"
setw -g pane-active-border-style "fg=#af98e6, bg=#1b1d26"
setw -g pane-border-style "fg=#7c7e8c, bg=#1b1d26"
setw -g message-style "fg=#7c7e8c, bg=#1b1d26, fill=#1b1d26"
set -g message-command-style "fg=#7c7e8c, bg=#1b1d26, fill=#1b1d26"
setw -g copy-mode-position-style "fg=#e9e9e9,bg=#6e7380"
set -g prompt-cursor-colour "#e9e9e9"
setw -g copy-mode-line-number-style "fg=#7c7e8c,dim"
setw -g copy-mode-current-line-number-style "fg=#bbbbbb,bold"
setw -g window-active-style "bg=#1b1d26"
if -F '#{==:#{version},next-3.8}' 'setw -g window-style "bg=#13151b,dim=20%"' 'setw -g window-style "bg=#13151b"'
set -g window-status-current-style "fg=#bbbbbb, bg=#1b1d26"
set -g window-status-style "fg=#e9e9e9, bg=#1b1d26"
set -g window-status-last-style "fg=#e9e9e9, bg=#1b1d26"
set -g window-status-activity-style "fg=#e9e9e9, bg=#1b1d26"
set -g window-status-bell-style "fg=#7c7e8c, bg=#1b1d26, bold"
