# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#131313"
set -g @color-surface-active "#1D1D20"
set -g @color-surface-chrome "#27272a"
set -g @color-surface-highlight "#2D2D31"
set -g @color-divider "#27272a"
set -g @color-copy-indicator "#6c6874"
set -g @color-text "#c9c7cd"
set -g @color-text-ui "#b4b1ba"
set -g @color-text-muted "#6c6874"
set -g @color-text-default "#b4b1ba"
set -g @color-accent-primary "#ea83a5"
set -g @color-accent-secondary "#92a2d5"
set -g @color-accent-tertiary "#e29eca"
set -g @color-accent-highlight "#b4b1ba"
set -g @color-accent-info "#85b5ba"
set -g @color-accent-periwinkle "#92a2d5"
set -g @color-accent-warn "#e6b99d"
set -g @color-accent-amber "#e6b99d"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#131313" ; setw pane-active-border-style "fg=#92a2d5, bg=#131313" } { setw window-active-style "bg=#1D1D20" ; setw pane-active-border-style "fg=#92a2d5, bg=#131313" }'
set -g status-style "bg=#131313"
setw -g pane-active-border-style "fg=#92a2d5, bg=#131313"
setw -g pane-border-style "fg=#6c6874, bg=#131313"
setw -g message-style "fg=#6c6874, bg=#131313, fill=#131313"
set -g message-command-style "fg=#6c6874, bg=#131313, fill=#131313"
setw -g copy-mode-position-style "fg=#b4b1ba,bg=#6c6874"
set -g prompt-cursor-colour "#b4b1ba"
setw -g copy-mode-line-number-style "fg=#6c6874,dim"
setw -g copy-mode-current-line-number-style "fg=#b4b1ba,bold"
setw -g window-active-style "bg=#131313"
setw -g window-style "bg=#131313"
set -g window-status-current-style "fg=#b4b1ba, bg=#131313"
set -g window-status-style "fg=#b4b1ba, bg=#131313"
set -g window-status-last-style "fg=#b4b1ba, bg=#131313"
set -g window-status-activity-style "fg=#b4b1ba, bg=#131313"
set -g window-status-bell-style "fg=#6c6874, bg=#131313, bold"
