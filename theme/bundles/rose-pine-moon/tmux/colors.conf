# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#232136"
set -g @color-surface-active "#2a273f"
set -g @color-surface-chrome "#393552"
set -g @color-surface-highlight "#44415a"
set -g @color-divider "#393552"
set -g @color-copy-indicator "#827ea1"
set -g @color-text "#fffaf3"
set -g @color-text-ui "#fffaf3"
set -g @color-text-muted "#9390ae"
set -g @color-text-default "#fffaf3"
set -g @color-accent-primary "#ea9d34"
set -g @color-accent-secondary "#f6c177"
set -g @color-accent-tertiary "#eb6f92"
set -g @color-accent-highlight "#3e8fb0"
set -g @color-accent-info "#31748f"
set -g @color-accent-periwinkle "#286983"
set -g @color-accent-warn "#d7827e"
set -g @color-accent-amber "#ea9a97"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#232136" ; setw pane-active-border-style "fg=#f6c177, bg=#232136" } { setw window-active-style "bg=#2a273f" ; setw pane-active-border-style "fg=#f6c177, bg=#232136" }'
set -g status-style "bg=#232136"
setw -g pane-active-border-style "fg=#f6c177, bg=#232136"
setw -g pane-border-style "fg=#9390ae, bg=#232136"
setw -g message-style "fg=#9390ae, bg=#232136, fill=#232136"
set -g message-command-style "fg=#9390ae, bg=#232136, fill=#232136"
setw -g copy-mode-position-style "fg=#fffaf3,bg=#827ea1"
set -g prompt-cursor-colour "#fffaf3"
setw -g copy-mode-line-number-style "fg=#9390ae,dim"
setw -g copy-mode-current-line-number-style "fg=#3e8fb0,bold"
setw -g window-active-style "bg=#232136"
setw -g window-style "bg=#232136"
set -g window-status-current-style "fg=#3e8fb0, bg=#232136"
set -g window-status-style "fg=#fffaf3, bg=#232136"
set -g window-status-last-style "fg=#fffaf3, bg=#232136"
set -g window-status-activity-style "fg=#fffaf3, bg=#232136"
set -g window-status-bell-style "fg=#9390ae, bg=#232136, bold"
