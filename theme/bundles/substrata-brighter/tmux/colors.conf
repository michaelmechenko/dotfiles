# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#191c25"
set -g @color-surface-active "#20222d"
set -g @color-surface-chrome "#272935"
set -g @color-surface-highlight "#2e313d"
set -g @color-divider "#272935"
set -g @color-copy-indicator "#6f7185"
set -g @color-text "#f0ecfe"
set -g @color-text-ui "#f0ecfe"
set -g @color-text-muted "#7b7d8f"
set -g @color-text-default "#f0ecfe"
set -g @color-accent-primary "#fead90"
set -g @color-accent-secondary "#dbc380"
set -g @color-accent-tertiary "#94cdd1"
set -g @color-accent-highlight "#cdb6dd"
set -g @color-accent-info "#afc5de"
set -g @color-accent-periwinkle "#889bb4"
set -g @color-accent-warn "#b8a161"
set -g @color-accent-amber "#d59076"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#191c25" ; setw pane-active-border-style "fg=#dbc380, bg=#191c25" } { setw window-active-style "bg=#20222d" ; setw pane-active-border-style "fg=#dbc380, bg=#191c25" }'
set -g status-style "bg=#191c25"
setw -g pane-active-border-style "fg=#dbc380, bg=#191c25"
setw -g pane-border-style "fg=#7b7d8f, bg=#191c25"
setw -g message-style "fg=#7b7d8f, bg=#191c25, fill=#191c25"
set -g message-command-style "fg=#7b7d8f, bg=#191c25, fill=#191c25"
setw -g copy-mode-position-style "fg=#f0ecfe,bg=#6f7185"
set -g prompt-cursor-colour "#f0ecfe"
setw -g copy-mode-line-number-style "fg=#7b7d8f,dim"
setw -g copy-mode-current-line-number-style "fg=#cdb6dd,bold"
setw -g window-active-style "bg=#191c25"
setw -g window-style "bg=#191c25"
set -g window-status-current-style "fg=#cdb6dd, bg=#191c25"
set -g window-status-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-last-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-activity-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-bell-style "fg=#7b7d8f, bg=#191c25, bold"
