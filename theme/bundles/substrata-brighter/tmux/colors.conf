# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#191c25"
set -g @color-surface-active "#20222d"
set -g @color-surface-chrome "#272935"
set -g @color-surface-highlight "#2e313d"
set -g @color-divider "#272935"
set -g @color-copy-indicator "#32353e"
set -g @color-text "#f0ecfe"
set -g @color-text-ui "#f0ecfe"
set -g @color-text-muted "#32353e"
set -g @color-text-default "#f0ecfe"
set -g @color-accent-primary "#fe9f7c"
set -g @color-accent-secondary "#d2b45f"
set -g @color-accent-tertiary "#fead90"
set -g @color-accent-highlight "#cf8164"
set -g @color-accent-info "#d59076"
set -g @color-accent-periwinkle "#ab924c"
set -g @color-accent-warn "#dbc380"
set -g @color-accent-amber "#b8a161"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#191c25" ; setw pane-active-border-style "fg=#d2b45f, bg=#191c25" } { setw window-active-style "bg=#20222d" ; setw pane-active-border-style "fg=#d2b45f, bg=#191c25" }'
set -g status-style "bg=#191c25"
setw -g pane-active-border-style "fg=#d2b45f, bg=#191c25"
setw -g pane-border-style "fg=#32353e, bg=#191c25"
setw -g message-style "fg=#32353e, bg=#191c25, fill=#191c25"
set -g message-command-style "fg=#32353e, bg=#191c25, fill=#191c25"
setw -g copy-mode-position-style "fg=#f0ecfe,bg=#32353e"
set -g prompt-cursor-colour "#f0ecfe"
setw -g copy-mode-line-number-style "fg=#32353e,dim"
setw -g copy-mode-current-line-number-style "fg=#cf8164,bold"
setw -g window-active-style "bg=#191c25"
setw -g window-style "bg=#191c25"
set -g window-status-current-style "fg=#cf8164, bg=#191c25"
set -g window-status-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-last-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-activity-style "fg=#f0ecfe, bg=#191c25"
set -g window-status-bell-style "fg=#32353e, bg=#191c25, bold"
