# Generated by `theme build`. Semantic @color-* options; do not edit by hand.
set -g @color-canvas "#100E11"
set -g @color-surface-active "#1A161C"
set -g @color-surface-chrome "#1C1C24"
set -g @color-surface-highlight "#2A2A35"
set -g @color-divider "#383848"
set -g @color-copy-indicator "#606079"
set -g @color-text "#BEBEBE"
set -g @color-text-ui "#9094A0"
set -g @color-text-muted "#656a80"
set -g @color-text-default "#a9b1d6"
set -g @color-accent-primary "#d8647e"
set -g @color-accent-secondary "#aeaed1"
set -g @color-accent-tertiary "#bb9dbd"
set -g @color-accent-highlight "#bebedb"
set -g @color-accent-info "#8ba9c1"
set -g @color-accent-periwinkle "#9b9bcc"
set -g @color-accent-warn "#f5cb96"
set -g @color-accent-amber "#f3be7c"

# Materialized static styles (tmux style options cannot expand formats).
set -g command-alias[200] 'refresh-active-bg=if -F "#{||:#{==:#{window_panes},1},#{window_zoomed_flag}}" { setw window-active-style "bg=#100E11" ; setw pane-active-border-style "fg=#aeaed1, bg=#100E11" } { setw window-active-style "bg=#1A161C" ; setw pane-active-border-style "fg=#aeaed1, bg=#100E11" }'
set -g status-style "bg=#100E11"
setw -g pane-active-border-style "fg=#aeaed1, bg=#100E11"
setw -g pane-border-style "fg=#656a80, bg=#100E11"
setw -g message-style "fg=#656a80, bg=#100E11, fill=#100E11"
set -g message-command-style "fg=#656a80, bg=#100E11, fill=#100E11"
setw -g copy-mode-position-style "fg=#a9b1d6,bg=#606079"
set -g prompt-cursor-colour "#a9b1d6"
setw -g copy-mode-line-number-style "fg=#656a80,dim"
setw -g copy-mode-current-line-number-style "fg=#bebedb,bold"
setw -g window-active-style "bg=#100E11"
setw -g window-style "bg=#100E11"
set -g window-status-current-style "fg=#bebedb, bg=#100E11"
set -g window-status-style "fg=#a9b1d6, bg=#100E11"
set -g window-status-last-style "fg=#a9b1d6, bg=#100E11"
set -g window-status-activity-style "fg=#a9b1d6, bg=#100E11"
set -g window-status-bell-style "fg=#656a80, bg=#100E11, bold"
