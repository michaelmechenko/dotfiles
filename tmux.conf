unbind r
bind r source-file ~/.config/tmux.conf

# Self-heal exec bits on load/reload: run-shell binds EXECUTE these scripts by path, so a
# checkout that didn't honor the exec bit (core.fileMode=false) would break them. Foreground
# so it finishes before any keybind fires; chmod is a binary, needs no script +x itself.
run-shell "chmod +x ~/.config/tmux_scripts/* 2>/dev/null"

# Self-heal @in_float_popup on load/reload: this global flag can get stuck at 1 forever if a
# float popup's shell command is ever interrupted abnormally (killed client, crash, disconnect)
# before its own cleanup runs (confirmed live -- every subsequent M-f then silently detached
# instead of opening). Only clear it if no client is actually attached to a float*/ephemeral*
# session right now, so a genuinely open popup isn't disrupted by `prefix r`.
run-shell "tmux list-clients -F '#{session_name}' 2>/dev/null | grep -qE '^(float|ephemeral)' || tmux set-option -gu @in_float_popup"

set -g focus-events on
# set -g allow-passthrough on
# NOTE: extended-keys 'always' forces extended (CSI-u) forwarding into every pane's
# child process even if it never asked for it — that's what previously broke things
# here. Plain 'on' only forwards to apps that explicitly request it (e.g. pi's Shift/
# Ctrl+Enter), and doesn't affect tmux's own root-table M-Shift binding recognition
# (M-J/M-L/M-W/...) — that recognition comes from the terminal's `extkeys` feature
# (already on for xterm-ghostty) independent of this option. Verified safe with all
# M-Shift binds + nnn popup / copy-mode. csi-u format requires tmux 3.5+ (see `tmux -V`).
# To pass a custom key through tmux, use an unmodified key (e.g. F13) instead — see
# ghostty ctrl+tab -> F13 and the ^[[25~ bind in zshrc.
set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-Space
bind c new-window -c "#{pane_current_path}"
set -g default-command zsh
set-option -g renumber-windows on
set -g base-index 1 # start windows numbering at 1
set-option -g mouse on

# Dynamic active background is materialized in the generated active palette fragment.
# tmux style options cannot expand #{...} formats, so the fragment emits concrete styles.
# Source once before hooks so tmux recognizes the generated refresh-active-bg alias.
source-file ~/.config/theme/active/tmux/colors.conf

set-hook -g after-resize-pane    refresh-active-bg
set-hook -g window-layout-changed refresh-active-bg
set-hook -g after-new-window     refresh-active-bg
set-hook -g after-select-window  refresh-active-bg
set-hook -g pane-exited          refresh-active-bg

# On copy/view-mode entry: switch to a block cursor. On exit: restore the global underline
# (setw -u) and tear down the M-U-only copy-mode line numbers (the per-pane override the M-U
# binding set survives entry because the entry branch doesn't touch it).
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" { setw cursor-style block } { setw -u cursor-style ; set -pu copy-mode-line-numbers }'


# Colors
# Semantic @color-* options and static style values are generated into the active
# bundle. Source the fragment at the END of this file, after format options are declared.

# Status-line sizing is CONTENT-MEASURED, not a hardcoded client_width threshold.
# The window list shrinks by truncating names to a computed per-name budget, and the
# status-right star block only appears when everything already fits at full length.
#
# How the measurement works (all pure format expansion -- no shell, no forks):
#   #{W:inactive,active}          loops the session's windows
#   #{s|##\[[^]]*\]||:...}       strips #[...] style directives (global replace)
#   #{n:...}                      length of the result -> RENDERED width
# So a form is declared once below and measured from that same declaration; there is
# no duplicate plain-text mirror to keep in sync.
#
# HARD RULE: nothing reachable from @m-* or @sl-name-budget may depend on the budget,
# or the expansion recurses forever. That is why @ws-name-form (which does use it) is
# never measured -- @m-frame measures @ws-frame-form + the current-window form, and
# @m-names adds the untruncated name lengths arithmetically.
#
# GOTCHA: #W / #S shorthands do NOT work as modifier operands (#{n:#S} and
# #{=/N/...:#W} both silently yield nothing). Use #{window_name} / #{session_name}.
# GOTCHA: forms used as #{W:a,b} arguments must not contain a top-level comma.

set -g @sl-gap 2          # minimum blank columns between window list and status-right
set -g @sl-min-name 4     # below this per-name budget, fall back to index-only

# One source of truth per visual form.
set -g @ws-frame-form '#I []'
set -g @ws-index-form "#[fg=#{@color-text-muted}]#I"
set -g @ws-name-form  "#[fg=#{@color-text-muted}]#I [#{=/#{E:#{@sl-name-budget}}/…:#{window_name}}]"

# Rendered widths. @m-frame is the per-window chrome ("N []" + separators) plus the
# current window's full entry; @m-names is the untruncated inactive names.
set -g @m-sep      '#{n:#{s|##\[[^]]*\]||:#{E:#{window-status-separator}}}}'
set -g @m-left     '#{n:#{s|##\[[^]]*\]||:#{E:#{status-left}}}}'
set -g @m-rshort   '#{n:#{s|##\[[^]]*\]||:#{E:#{@sr-short-form}}}}'
set -g @m-rfull    '#{n:#{s|##\[[^]]*\]||:#{E:#{@sr-full-form}}}}'
set -g @m-frame    '#{e|+:#{n:#{s|##\[[^]]*\]||:#{W:#{E:#{@ws-frame-form}},#{E:#{@window-status-current-format-base}}}}},#{e|*:#{E:#{@m-sep}},#{e|-:#{session_windows},1}}}'
set -g @m-names    "#{n:#{W:#{window_name},}}"
set -g @m-listfull "#{e|+:#{E:#{@m-frame}},#{E:#{@m-names}}}"

# Two fit tests against the UNTRUNCATED list. fits-full also affords the star block;
# fits-short only the bare session name. fits-full implies fits-short (rfull > rshort),
# which is what keeps behaviour monotonic as the terminal widens:
#   truncated + #S   ->   full names + #S   ->   full names + #S [ * * * ]
set -g @sl-fits-full  "#{e|<=:#{e|+:#{E:#{@m-listfull}},#{e|+:#{E:#{@m-rfull}},#{e|+:#{E:#{@m-left}},#{@sl-gap}}}},#{client_width}}"
set -g @sl-fits-short "#{e|<=:#{e|+:#{E:#{@m-listfull}},#{e|+:#{E:#{@m-rshort}},#{e|+:#{E:#{@m-left}},#{@sl-gap}}}},#{client_width}}"

# Per-inactive-name budget, used ONLY when even the short right-hand side does not
# leave room for full names. Truncating while @sl-fits-short is true would make names
# shrink as the terminal grows (widening turns on the star block, which costs columns);
# short-circuiting to 999 there keeps it monotonic. The session_windows>1 guard avoids
# a divide-by-zero (#{e|/:n,0} returns garbage, not an error). 1 column is reserved for
# the ellipsis, and a budget above a name's length is a no-op.
set -g @sl-name-budget "#{?#{E:#{@sl-fits-short}},999,#{?#{e|>:#{session_windows},1},#{e|-:#{e|/:#{e|-:#{e|-:#{e|-:#{e|-:#{client_width},#{E:#{@m-left}}},#{E:#{@m-rshort}}},#{@sl-gap}},#{E:#{@m-frame}}},#{e|-:#{session_windows},1}},1},999}}"

# Entry points the M-N directory-mode toggle restores from -- keep these names.
set -g @window-status-current-format-base "#[fg=#{@color-accent-secondary}]#I [#W]"
set -g @window-status-format-base "#{?#{e|>=:#{E:#{@sl-name-budget}},#{@sl-min-name}},#{E:#{@ws-name-form}},#{E:#{@ws-index-form}}}"

##
## keybindings
##

set-window-option -g mode-keys vi
# Mouse-drag copy: scrolled up (scroll_position>0) -> stay in copy mode;
# at the live bottom (==0) -> copy and exit immediately.
bind-key -T copy-mode-vi MouseDragEnd1Pane if -F '#{scroll_position}' {
    send-keys -X copy-pipe '$HOME/.config/qol_scripts/copy'
} {
    send-keys -X copy-pipe-and-cancel '$HOME/.config/qol_scripts/copy'
}
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel '$HOME/.config/qol_scripts/copy'
set -s copy-command '$HOME/.config/qol_scripts/copy'

# flash.nvim-style jump: type a query, matches get a single-key label, press
# it (or Enter for the nearest match) to move the copy-mode cursor there.
bind-key -T copy-mode-vi S run-shell "~/.config/tmux_scripts/tmux-flash-jump.py '#{pane_id}'"

# half-page-up into copy mode (behind prefix to not shadow C-u kill-line)
# Line numbers show ONLY for this deliberate entry: set the per-pane override BEFORE
# entering (copy-mode reads it at init) — the pane-mode-changed hook tears it down on
# exit so M-u/M-n (and mouse-wheel) inherit the global copy-mode-line-numbers=off.
bind-key -n M-U set -p copy-mode-line-numbers hybrid \; copy-mode
bind-key -n M-S-U set -p copy-mode-line-numbers hybrid \; copy-mode

# scroll up 10 lines. Whenever the focused pane's foreground process is literally nnn (true both
# inside the M-d popup's listing pane AND a plain `n` alias pane in any regular tmux window -
# `pane_current_command` doesn't care which session/window it's in), scroll the sibling preview
# pane directly instead of forwarding the raw key - nnn and its pager (moor/less) don't understand
# M-u themselves (see nnn/plugins/.nnn-preview-scroll). In other popups (fzf pickers etc.), forward
# the raw key - their own fzf --bind interprets it as preview-scroll. Outside popups, copy-mode
# scroll (-e auto-exits at the live bottom).
bind-key -n M-u if -F '#{==:#{pane_current_command},nnn}' { run-shell "~/.config/nnn/plugins/.nnn-preview-scroll up" } { if -F '#{popup_width}' { send-keys M-u } { run-shell "tmux copy-mode -e ; tmux send-keys -N 10 -X scroll-up" } }

# scroll down 10 lines - same three-way branch as M-u above (-e exits copy-mode once back at the
# live bottom).
bind-key -n M-n if -F '#{==:#{pane_current_command},nnn}' { run-shell "~/.config/nnn/plugins/.nnn-preview-scroll down" } { if -F '#{popup_width}' { send-keys M-n } { run-shell "tmux copy-mode -e ; tmux send-keys -N 10 -X scroll-down" } }

# vim keybinds
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -n M-h select-pane -L
bind-key -n M-j if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-j } { select-pane -D }
bind-key -n M-k if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-k } { select-pane -U }
bind-key -n M-l select-pane -R

# Extended input reports physical Alt+Shift letters as M-S-<letter>; legacy
# input reports M-<uppercase>. Each intentional uppercase root action binds both.
# Lowercase Meta remains distinct; M-BTab is the Shift+Tab special case below.
# split window
bind-key -n M-J split-window -v -c "#{pane_current_path}"
bind-key -n M-S-J split-window -v -c "#{pane_current_path}"
bind-key -n M-L split-window -h -l 50% -c "#{pane_current_path}"
bind-key -n M-S-L split-window -h -l 50% -c "#{pane_current_path}"

# resize panes
bind-key -n M-W resize-pane -U 
bind-key -n M-S-W resize-pane -U
bind-key -n M-S resize-pane -D 
bind-key -n M-S-S resize-pane -D
bind-key -n M-A resize-pane -L 
bind-key -n M-S-A resize-pane -L
bind-key -n M-D resize-pane -R 
bind-key -n M-S-D resize-pane -R

# window focus
bind-key -n M-z resize-pane -Z
bind-key -n M-x confirm-before -c z -p "kill pane? (z/c)" "kill-pane"
bind-key -n M-X confirm-before -c z -p "kill window? (zz/c)" "confirm-before -c z -p 'kill window? (z/c)' kill-window"
bind-key -n M-S-X confirm-before -c z -p "kill window? (zz/c)" "confirm-before -c z -p 'kill window? (z/c)' kill-window"

# new window
bind-key -n M-e new-window -c "#{pane_current_path}"

# floating terminals
bind-key -n M-f run-shell "~/.config/tmux_scripts/tmuxpopup"
# bind-key -n M-F run-shell "~/.config/tmux_scripts/tmuxpopup-opposite"
bind-key -n M-F if-shell '[ "$(tmux display-message -p "#{session_name}")" = "float" ]' 'switch-client -l' 'switch-client -t float'
bind-key -n M-S-F if-shell '[ "$(tmux display-message -p "#{session_name}")" = "float" ]' 'switch-client -l' 'switch-client -t float'
bind-key -n M-c run-shell "~/.config/tmux_scripts/tmuxpopup-ephemeral"

# prefix a: from inside an ephemeral popup, join this pane back into the window
# it was spawned from (no-op outside an ephemeral session).
bind-key a run-shell "~/.config/tmux_scripts/tmux-ephemeral-attach"

# Popup layout cycle (M-Right/M-Left) is disabled for now: reopening a popup
# with new geometry right after detach-client races tmux's own popup teardown
# and reliably makes the popup vanish instead of resizing (confirmed live,
# same bug pre-existed in the old maximize/restore/M-m script too). Forward
# the raw key always so Ghostty's Alt+arrow -> zsh word-jump keeps working.
bind-key -n M-Right send-keys M-Right
bind-key -n M-Left send-keys M-Left

# create new window from pane's cwd in session float
bind-key f run-shell 'tmux new-window -t float: -c "$(tmux display-message -p "#{pane_current_path}")" && ~/.config/tmux_scripts/tmuxpopup'

# choose session/pane
bind-key -n M-s run-shell "~/.config/tmux_scripts/tmux-session-ls"
bind-key -n M-w run-shell "~/.config/tmux_scripts/tmux-window-ls"

# rename pane
bind-key -n M-t command-prompt -p "rename pane:" -I "#{pane_title}" "select-pane -T '%1' ; set -p @pane-named '%1'"

# tree view popup
bind-key -n M-T run-shell "~/.config/tmux_scripts/tmux-other-panes-ls"
bind-key -n M-S-T run-shell "~/.config/tmux_scripts/tmux-other-panes-ls"

# cycle sessions from the status-right session list in its float-first creation order.
# Keep run-shell backgrounded: tmux 3.7 can crash in the synchronous fork path here.
bind-key -n MouseDown1StatusRight run-shell -b '~/.config/tmux_scripts/tmux-cycle-session previous "#{client_name}"'
bind-key -n MouseDown3StatusRight run-shell -b '~/.config/tmux_scripts/tmux-cycle-session next "#{client_name}"'

# pane right-click
unbind -T root MouseDown3Pane
bind -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" {
    select-pane -t =
    send-keys -M
} {
    display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
        "open in file manager" o { run-shell "$HOME/.config/tmux_scripts/tmux-open-target finder '#{pane_id}' #{q:pane_current_path}" } \
        '' \
        "#{?#{m/r:(copy|view)-mode,#{pane_mode}},go to top,}" < { send-keys -X history-top } \
        "#{?#{m/r:(copy|view)-mode,#{pane_mode}},go to bottom,}" > { send-keys -X history-bottom } \
        '' \
        "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},paste,}" p { paste-buffer } \
        '' \
        "#{?mouse_word,copy word,}" c { set-buffer "#{q:mouse_word}" } \
        "#{?mouse_line,copy line,}" l { set-buffer "#{q:mouse_line}" } \
        "#{?mouse_hyperlink,copy link,}" h { set-buffer "#{q:mouse_hyperlink}" } \
        '' \
        "horizontal split" h { split-window -h } \
        "vertical split" v { split-window -v } \
        '' \
        "#{?#{>:#{window_panes},1},,-}swap up" u { swap-pane -U } \
        "#{?#{>:#{window_panes},1},,-}swap down" d { swap-pane -D } \
        "#{?pane_marked_set,,-}swap marked" s { swap-pane } \
        '' \
        kill x { kill-pane } \
        respawn r { respawn-pane -k } \
        "#{?pane_marked,unmark,mark}" m { select-pane -m } \
        "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,unzoom,zoom}" z { resize-pane -Z }
}

# Alt+right-click (force menu even when app has mouse focus)
unbind -T root M-MouseDown3Pane
bind -T root M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
    "open in file manager" o { run-shell "$HOME/.config/tmux_scripts/tmux-open-target finder '#{pane_id}' #{q:pane_current_path}" } \
    '' \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},go to top,}" < { send-keys -X history-top } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},go to bottom,}" > { send-keys -X history-bottom } \
    '' \
    "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},paste,}" p { paste-buffer } \
    '' \
    "#{?mouse_word,copy word,}" c { set-buffer "#{q:mouse_word}" } \
    "#{?mouse_line,copy line,}" l { set-buffer "#{q:mouse_line}" } \
    "#{?mouse_hyperlink,copy link,}" h { set-buffer "#{q:mouse_hyperlink}" } \
    '' \
    "horizontal split" h { split-window -h } \
    "vertical split" v { split-window -v } \
    '' \
    "#{?#{>:#{window_panes},1},,-}swap up" u { swap-pane -U } \
    "#{?#{>:#{window_panes},1},,-}swap down" d { swap-pane -D } \
    "#{?pane_marked_set,,-}swap marked" s { swap-pane } \
    '' \
    kill x { kill-pane } \
    respawn r { respawn-pane -k } \
    "#{?pane_marked,unmark,mark}" m { select-pane -m } \
    "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,unzoom,zoom}" z { resize-pane -Z }

# break pane into new window (names the window after a manually-renamed pane)
bind q run-shell -b "~/.config/tmux_scripts/tmux-break-pane '#{pane_id}'"

bind-key -n M-q if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-q } { run-shell -b "~/.config/tmux_scripts/tmux-break-pane '#{pane_id}'" }

# send to prev/next window

# next window (tidies the destination with main-vertical if it already had panes)
bind-key -n M-E run-shell "~/.config/tmux_scripts/tmux-send-pane-adjacent next"
bind-key -n M-S-E run-shell "~/.config/tmux_scripts/tmux-send-pane-adjacent next"

# prev window
bind-key -n M-Q run-shell "~/.config/tmux_scripts/tmux-send-pane-adjacent prev"
bind-key -n M-S-Q run-shell "~/.config/tmux_scripts/tmux-send-pane-adjacent prev"

# send pane to 'n' window
bind-key -n M-i run-shell "~/.config/tmux_scripts/tmux-pane-to-window"

# send pane to session
bind-key -n M-I run-shell "~/.config/tmux_scripts/tmux-window-to-session"
bind-key -n M-S-I run-shell "~/.config/tmux_scripts/tmux-window-to-session"

# swap windows
bind-key -n M-, swap-window -t -1\; select-window -t -1
bind-key -n M-. swap-window -t +1\; select-window -t +1

# move panes between adjacent visual columns
bind-key \; run-shell "~/.config/tmux_scripts/tmux-move-pane-column left"
bind-key "'" run-shell "~/.config/tmux_scripts/tmux-move-pane-column right"

# swap panes
bind-key -n M-< swap-pane -U
bind-key -n M-> swap-pane -D

# tree view
# bind-key -n M-W choose-window
# bind-key -n M-S choose-session
# Keep the prefix fallback aligned with the root M-w fzf pane picker.
bind-key w run-shell "~/.config/tmux_scripts/tmux-window-ls"
# choose-tree remains available explicitly with `:choose-tree`.
# prefix t prompts for a per-pane border label (see pane-border-format below).
bind-key t command-prompt -p "pane label:" -I "#{@pane-label}" "set -p @pane-label '%1'"

# layouts
# main-vertical: main pane = half width so it matches the stacked right column
setw -g main-pane-width 50%
bind-key -n M-V select-layout even-vertical
bind-key -n M-S-V select-layout even-vertical
# M-H equalizes an ordinary two-pane window side-by-side; with 3+ panes it
# cycles tmux's pane-count-aware presets backwards via `previous-layout`.
# A managed sidebar disables the two-pane branch so its fixed width is preserved.
# main-pane-width 50% above keeps the main-* presets at half width/height.
bind-key -n M-H if-shell -F '#{&&:#{==:#{window_panes},2},#{==:#{@sidebar_pane_id},}}' { select-layout even-horizontal } { previous-layout }
bind-key -n M-S-H if-shell -F '#{&&:#{==:#{window_panes},2},#{==:#{@sidebar_pane_id},}}' { select-layout even-horizontal } { previous-layout }
bind-key -n M-v select-layout tiled

bind-key -n M-\; previous-window
bind-key -n M-\' next-window

bind-key -n M-1 select-window -t:=1
bind-key -n M-2 select-window -t:=2
bind-key -n M-3 select-window -t:=3
bind-key -n M-4 select-window -t:=4
bind-key -n M-5 select-window -t:=5
bind-key -n M-6 select-window -t:=6
bind-key -n M-7 select-window -t:=7
bind-key -n M-8 select-window -t:=8
bind-key -n M-9 select-window -t:=9

# switch sessions
bind-key -n M-\: switch-client -p -O index
bind-key -n M-\[ switch-client -p -O index
bind-key -n M-\" switch-client -n -O index
bind-key -n M-\] switch-client -n -O index

# new session
bind-key C command-prompt "new -s '%%'"
bind-key -n M-C command-prompt "new -s '%%'"
bind-key -n M-S-C command-prompt "new -s '%%'"

##
## status bar
##

set-option -g status-position top
# Keep window selection on the first row. The second row stays muted for a
# full-width pane; split layouts recolor the active pane's horizontal span plus
# its adjacent one-cell split borders, clamped at the window edges. Every real
# split-border intersection beside the active pane is marked with an accent +.
set -g status 2
set -g status-format[1] "#{?#{==:#{pane_width},#{window_width}},#[fg=#{@color-text-muted}]#{R:─,#{client_width}},#[fg=#{@color-text-muted}]#{R:─,#{?#{e|>:#{pane_left},0},#{e|-:#{pane_left},1},0}}#[fg=#{@color-accent-secondary}]#{?#{e|>:#{pane_left},0},+,}#{R:─,#{pane_width}}#{?#{e|<:#{e|+:#{pane_left},#{pane_width}},#{window_width}},+,}#[fg=#{@color-text-muted}]#{R:─,#{e|-:#{client_width},#{e|+:#{e|+:#{pane_left},#{pane_width}},#{?#{e|<:#{e|+:#{pane_left},#{pane_width}},#{window_width}},1,0}}}}}"

# status-style is materialized by theme/active/tmux/colors.conf.
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

set -g status-left ""
# set -g status-left '#[align=absolute-centre]#[fg=#{@color-text-muted}]`#{?#{==:#{pane_current_path},#{HOME}},~,#{s|$HOME|~|:#{d:pane_current_path}}/#{b:pane_current_path}}`'

# Toggle directory mode without passing status-left's nested format through a shell.
# A nonempty status-left means directory mode is active, so clear it; otherwise enable it.
bind-key -n M-N if -F '#{status-left}' {
    set -g status-left ""
    set -g window-status-format "#{E:#{@window-status-format-base}}"
    set -g window-status-current-format "#{E:#{@window-status-current-format-base}}"
} {
    set -g status-left "#[fg=#{@color-text-muted}]* #[align=absolute-centre]#[fg=#{@color-text-muted}]`#{?#{==:#{pane_current_path},#{HOME}},~,#{s|$HOME|~|:#{d:pane_current_path}}}/#{b:pane_current_path}`"
    set -g window-status-format ""
    set -g window-status-current-format ""
}
bind-key -n M-S-N if -F '#{status-left}' {
    set -g status-left ""
    set -g window-status-format "#{E:#{@window-status-format-base}}"
    set -g window-status-current-format "#{E:#{@window-status-current-format-base}}"
} {
    set -g status-left "#[fg=#{@color-text-muted}]* #[align=absolute-centre]#[fg=#{@color-text-muted}]`#{?#{==:#{pane_current_path},#{HOME}},~,#{s|$HOME|~|:#{d:pane_current_path}}}/#{b:pane_current_path}`"
    set -g window-status-format ""
    set -g window-status-current-format ""
}

# color defined by session name
# set -g status-right "#[fg=#{@color-text-muted}]#S#[none] #[fg=#{@color-text-muted}][#{S:#{?#{window_zoomed_flag},#{?#{==:#{session_name},float},#{?#{==:#{session_name},#{client_session}}, #[fg=#bebedb]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * },#{?#{==:#{session_name},ephemeral},#{?#{==:#{session_name},#{client_session}}, #[fg=#bebedb]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * },#{?#{==:#{session_name},#{client_session}}, #[fg=#bebedb]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * }}},#{?#{==:#{session_name},float},#{?#{==:#{session_name},#{client_session}}, #[fg=#8ba9c1]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * },#{?#{==:#{session_name},ephemeral},#{?#{==:#{session_name},#{client_session}}, #[fg=#d8647e]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * },#{?#{==:#{session_name},#{client_session}}, #[fg=#c9b1c9]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * }}}}}]"

# The two right-hand forms are declared here (next to their history above) and are
# measured by @m-rshort / @m-rfull near the top of this file. The star block appears
# only when @sl-fits-full says the row already fits at full window-name length.
set -g @sr-short-form "#[fg=#{@color-text-muted}]#S"
# Two filtered loops preserve tmux's creation order within each group while forcing
# the exact `float` session to the front, matching tsave/tload, fzf navigation, and click menus.
set -g @sr-session-star "#{?#{==:#{session_name},#{client_session}}, #[fg=#{@color-accent-secondary}]#[underscore]*#[none]#[fg=#{@color-text-muted}] , * }"
set -g @sr-full-form "#[fg=#{@color-text-muted}]#S#[none] #[fg=#{@color-text-muted}][#{S:#{?#{==:#{session_name},float},#{E:#{@sr-session-star}},}}#{S:#{?#{==:#{session_name},float},,#{E:#{@sr-session-star}}}}]"
set -g status-right "#{?#{E:#{@sl-fits-full}},#{E:#{@sr-full-form}},#{E:#{@sr-short-form}}}"

# bind-key R rename-window '#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}'
bind-key W command-prompt -I "#W" "rename-window '%%'"
bind-key S command-prompt -I "#S" "rename-session '%%'"
bind-key -n M-R command-prompt -I "#S" "rename-session '%%'"
bind-key -n M-S-R command-prompt -I "#S" "rename-session '%%'"
bind-key -n M-r command-prompt -I "#W" "rename-window '%%'"

setw -g pane-border-status bottom
# Active and inactive footers deliberately have different silhouettes. Zoom keeps
# the active silhouette and adds only a divider-coloured background block.
setw -g pane-border-format "#{?pane_active,#[align=centre]#{?#{window_zoomed_flag},#[bg=#{@color-divider}],}#{?@pane-label,#[fg=#{@color-accent-secondary}]*───*───*───*───*───#[fg=#{@color-accent-tertiary}]#{@pane-label}#[fg=#{@color-accent-secondary}]───*───*───*───*───*,#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]─#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]─#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*#[fg=#{@color-accent-secondary}]───#[fg=#{@color-accent-tertiary}]*}#{?#{==:#{pane_width},#{window_width}},,#{?#{e|<:#{e|+:#{pane_left},#{pane_width}},#{window_width}},#[fg=#{@color-accent-secondary}]──,#{?#{&&:#{m/r:[13579]$,#{pane_width}},#{&&:#{@pane-label},#{m/r:[02468]$,#{n:#{@pane-label}}}}},#[fg=#{@color-accent-secondary}]──,#[fg=#{@color-accent-secondary}]────}}}#{?#{window_zoomed_flag},#[bg=#{@color-canvas}],},#[align=centre]#[fg=#{@color-text-muted}]#{?@pane-label,#[fg=#{@color-text-muted}]*───*───*───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]#{@pane-label}#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───*───*───*,#[fg=#{@color-text-muted}]*───*───*───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]─#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]─#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───#[fg=#{@color-accent-primary}]*#[fg=#{@color-text-muted}]───*───*───*}#{?#{==:#{pane_width},#{window_width}},,#{?#{e|<:#{e|+:#{pane_left},#{pane_width}},#{window_width}},#[fg=#{@color-text-muted}]──,#{?#{&&:#{m/r:[13579]$,#{pane_width}},#{&&:#{@pane-label},#{m/r:[02468]$,#{n:#{@pane-label}}}}},#[fg=#{@color-text-muted}]──,#[fg=#{@color-text-muted}]────}}}}"

# Pane border styles are materialized by theme/active/tmux/colors.conf. Do not put
# #{@color-*} in a style option: tmux treats it as a literal invalid colour.
setw -g pane-border-lines "single"
setw -g pane-border-indicators "colour"
setw -g pane-scrollbars "off"

setw -g popup-border-lines "rounded"

# Generated message styles retain fill=<canvas>, required on next-3.7+ so command
# prompts repaint their entire width. Copy-mode indicator and prompt cursor are generated too.
setw -g cursor-style underline

# copy-mode line numbers (next-3.7): hybrid = current line absolute, others relative
# (vim number+relativenumber). Gutter shifts content but selection coords are un-offset
# internally, so copied text is unaffected. Press N in copy mode if not shown by default.
setw -g copy-mode-line-numbers off
# Line-number styles are materialized by theme/active/tmux/colors.conf.

##
## window styling
##

set-option -g automatic-rename on
# A sidebar pane is infrastructure, not a window identity. Preserve the current
# name while it is focused; content panes retain the normal Claude/command rename.
# Claude Code sets its comm to a version (2.1.160 or 2_1_193), hence [._].
set-option -g automatic-rename-format '#{?#{@sidebar_pane},#{window_name},#{?#{m:*[0-9][._][0-9]*[._][0-9]*,#{pane_current_command}},claude,#{pane_current_command}}}'

# Active/inactive window styles are materialized by theme/active/tmux/colors.conf.

# set -g window-status-current-format "#[bold]#{?#{e|>=:#{client_width},100}, #{pane_current_command} #[fg=#bb9dbd]#[none][#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}] , [#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}] }"
# set -g window-status-format "#[fg=#{@color-text-default}]#{?#{e|>=:#{client_width},100}, #{pane_current_command} #[fg=#{@color-text-muted}]#[none][#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}] , [#{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}] }"

set -g window-status-current-format "#{E:#{@window-status-current-format-base}}"
set -g window-status-format "#{E:#{@window-status-format-base}}"

set -g window-status-separator "#[fg=#{@color-text-muted}] * "

# Window-status styles are materialized by theme/active/tmux/colors.conf.

set-option -g status-interval 0

## plugins

# M-o: one typed fzf URL/file/directory list (tmux-open-picker). The binding captures
# '#{pane_id}' once; the picker owns popup creation and carries it into private inner mode,
# so M-o never uses global TMUX_OPEN_PANE state. Inside a popup/nnn, forward M-o raw: fzf's
# alt-o:abort toggle-closes the active picker, matching the M-j/M-q forwarding policy.
bind-key -n M-o if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-o } { run-shell "~/.config/tmux_scripts/tmux-open-picker '#{pane_id}'" }
# extrakto: keep the user's FZF_DEFAULT_OPTS palette (default unset strips it), and route
# ctrl-o opens through the shared tmux-open-target (file -> nvim split; else fall back to `open`).
# The M-K wrapper records the origin pane so the opener can resolve relative paths + split off it.
set -g @extrakto_fzf_unset_default_opts "false"
set -g @extrakto_open_tool "~/.config/tmux_scripts/tmux-open-target"
bind-key -n M-K if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-K } { run-shell "~/.config/tmux_scripts/tmux-extrakto-launch '#{pane_id}'" }
bind-key -n M-S-K if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-K } { run-shell "~/.config/tmux_scripts/tmux-extrakto-launch '#{pane_id}'" }

# nnn file explorer (in-nnn ;h / ;v spawn splits in the origin window)
#   M-d -> centred float;  M-B -> overlay the launching pane.
bind-key -n M-d run-shell "~/.config/tmux_scripts/tmux-nnn-explorer"
bind-key -n M-B run-shell "~/.config/tmux_scripts/tmux-nnn-explorer pane"
bind-key -n M-S-B run-shell "~/.config/tmux_scripts/tmux-nnn-explorer pane"

# claude code integration
# M-b: cross-tmux menu of all claude sessions (enter=focus, k=approve all waiting)
bind-key -n M-b run-shell "~/.config/tmux_scripts/tmux-claude-menu"
# M-G: open current session's last response in an nvim split (right if 1 pane, else above the right pane)
bind-key -n M-G run-shell "~/.config/tmux_scripts/tmux-claude-last-response"
bind-key -n M-S-G run-shell "~/.config/tmux_scripts/tmux-claude-last-response"
# prefix . : cycle to next claude session needing user input
bind-key . run-shell "~/.config/tmux_scripts/tmux-claude-next-permission"
# M-P: Claude session's plan if this pane has one (same right-side placement as M-G),
# else falls back to this pane's pi session's last response.
bind-key -n M-P run-shell "~/.config/tmux_scripts/tmux-M-P-dispatch"
bind-key -n M-S-P run-shell "~/.config/tmux_scripts/tmux-M-P-dispatch"

bind-key -n M-g if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-g } { run-shell "~/.config/tmux_scripts/tmux-lazygit-popup" }

# M-p: scratch nvim split for composing a prompt; :wq/ZZ pastes it back into
# the pane that triggered it (pi, Claude Code, opencode, a shell, ...).
bind-key -n M-p run-shell "~/.config/tmux_scripts/tmux-pi-prompt '#{pane_id}'"

# The left mm-sidebar pane (sessions/panes/projects/filetree/scratch tabs, plus
# docked agents_glance/system_stats blocks below). Each window owns its sidebar;
# global @sidebar_persistent synchronizes those instances without moving panes:
#
#   M-Tab    persistence toggle  enable+ensure current window; disable+close all
#   M-BTab   focus switch        focus the current window's sidebar/content pair
#
# q/Esc inside a sidebar also disables persistence and closes all instances.
#
# Reachable via ghostty/config's alt+tab=csi:9;3u and alt+shift+tab=csi:9;4u
# mappings (Tab = keycode 9; CSI-u modifiers are 1 + shift(1) + alt(2)) plus
# tmux's extended-keys on/csi-u. Both are guarded so they forward raw inside any
# popup or the nnn session, matching the M-j/M-q pattern.
#
# NOTE: the focus gesture MUST be bound as M-BTab, not M-S-Tab. tmux rewrites
# Shift+Tab to Backtab on the INPUT path (tty-keys.c, tty_keys_extended_key):
#     if ((nkey & KEYC_MASK_KEY) == '\011' && (nkey & KEYC_SHIFT))
#             nkey = KEYC_BTAB | (nkey & ~KEYC_MASK_KEY & ~KEYC_SHIFT);
# so ghostty's \e[9;4u arrives as M-BTab. The BIND parser (key-string.c) does no
# such conversion, so `bind -n M-S-Tab` is accepted and echoed back verbatim by
# list-keys while never matching a real keypress -- it silently did nothing for
# the whole life of this bind. M-Tab is unaffected: \e[9;3u carries no Shift.
# The prefix fallback below already spelled it BTab, which is why that one works.
# Reload only SETS: after changing this, clear the dead bind once with
#     tmux unbind -n M-S-Tab
bind-key -n M-Tab if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-Tab } { run-shell "TMUX_PANE='#{pane_id}' MM_SIDEBAR_ORIGIN_CLIENT='#{client_name}' ~/.config/tmux_scripts/tmux-sidebar-toggle --toggle-persistent" }
bind-key -n M-BTab if -F '#{||:#{popup_width},#{==:#{session_name},nnn}}' { send-keys M-BTab } { run-shell "TMUX_PANE='#{pane_id}' MM_SIDEBAR_ORIGIN_CLIENT='#{client_name}' ~/.config/tmux_scripts/tmux-sidebar-toggle --focus" }

# prefix Tab / prefix BTab: the same two gestures, reachable from ANY terminal.
# The M- forms only arrive because ghostty/config maps them to CSI-u -- from
# another terminal emulator, or over SSH from a machine without those mappings,
# they silently do nothing. The prefix table needs no terminal cooperation, so the
# sidebar is never unreachable. Same script, same modes.
bind-key -T prefix Tab run-shell "TMUX_PANE='#{pane_id}' MM_SIDEBAR_ORIGIN_CLIENT='#{client_name}' ~/.config/tmux_scripts/tmux-sidebar-toggle --toggle-persistent"
bind-key -T prefix BTab run-shell "TMUX_PANE='#{pane_id}' MM_SIDEBAR_ORIGIN_CLIENT='#{client_name}' ~/.config/tmux_scripts/tmux-sidebar-toggle --focus"

# Re-pin the sidebar to its configured width. tmux scales panes PROPORTIONALLY when
# a client or window resizes, so a Ghostty window resize or a monitor attach/detach
# drifts the 36-col sidebar off 36 columns (measured: 160->100 collapsed it to 1).
#
# TWO non-obvious requirements, both established by testing the naive version:
#
#  - `run-shell -b` (deferred), NOT an inline `resize-pane`. A resize issued
#    synchronously inside these hooks is discarded: tmux applies its own
#    proportional layout after the hook body returns and overwrites it. The inline
#    form fired correctly every time and the width still ended up at 1.
#  - the script sweeps ALL windows rather than the hook using `#{@sidebar_pane_id}`
#    inline, because client-resized resolves formats against the client's current
#    window only, leaving sidebars in other windows drifted.
#
# The [100] index is REQUIRED, not cosmetic: window-layout-changed and
# after-resize-pane already carry refresh-active-bg at index [0], and an unindexed
# `set-hook -g <name>` overwrites index 0 -- silently deleting the active-pane
# background switching. Never drop the index here.
#
# NOTE: `show-hooks -g` with no argument does NOT list window-layout-changed, so it
# looks unset. Query it by name (`show-hooks -g window-layout-changed`) to see both
# index 0 and 100. The hook does fire -- verified by instrumenting it.
set-hook -g client-resized[100] 'run-shell -b "~/.config/tmux_scripts/tmux-sidebar-repin"'
set-hook -g window-layout-changed[100] 'run-shell -b "~/.config/tmux_scripts/tmux-sidebar-repin"'
# Persistent mode is reconciled only on tmux lifecycle events. [101] keeps it
# independent from both styling [0] and re-pin [100] hooks.
set-hook -g after-new-window[101] 'run-shell -b "~/.config/tmux_scripts/tmux-sidebar-sync #{q:window_id} #{q:client_name}"'
set-hook -g after-select-window[101] 'run-shell -b "~/.config/tmux_scripts/tmux-sidebar-sync #{q:window_id} #{q:client_name}"'
set-hook -g client-session-changed[101] 'run-shell -b "~/.config/tmux_scripts/tmux-sidebar-sync #{q:window_id} #{q:client_name}"'
# pane-exited runs before tmux removes the dead pane from list-panes; defer one
# bounded turn so sync observes the final owner set, not a still-marked corpse.
set-hook -g pane-exited[101] 'run-shell -b "sleep 0.05; ~/.config/tmux_scripts/tmux-sidebar-sync #{q:window_id} #{q:client_name}"'
# Also covers an explicit kill-pane, which may not emit pane-exited on every
# tmux build. The lifecycle lock drops the split/close layout events it races.
set-hook -g window-layout-changed[101] 'run-shell -b "sleep 0.05; ~/.config/tmux_scripts/tmux-sidebar-sync #{q:window_id} #{q:client_name}"'

# Keep this last: the generated fragment owns concrete tmux style options because
# style options do not support dynamic #{...} expansion.
source-file ~/.config/theme/active/tmux/colors.conf
